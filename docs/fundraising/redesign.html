<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Investors and Fundraising redesign</title>
<style>
/* Tokens copied from packages/ui-tokens/src/tokens.css */
:root,[data-theme="dark"]{color-scheme:dark;
  --background:#1c1c1a;--foreground:#ecebe6;--card:#252523;--primary:#f1f0eb;--primary-foreground:#1c1c1a;
  --secondary:#282826;--muted:#252523;--muted-foreground:#9c9a93;--accent:#2a2927;--destructive:#f46262;
  --border:#2e2d2a;--input:#4a4944;--ring:#3b82f6;--sidebar:#222220;--sidebar-border:#2a2926;--sidebar-accent:#2a2927;
  --link:#4f8ff7;--success:#4ecb71;--warning:#e9c46a;--radius:.75rem}
[data-theme="light"]{color-scheme:light;
  --background:#fafaf8;--foreground:#1a1a1a;--card:#ffffff;--primary:#1a1a1a;--primary-foreground:#f1f1ef;
  --secondary:#f0f0ed;--muted:#f0f0ed;--muted-foreground:#6c6c70;--accent:#eaeae6;--destructive:#dc2626;
  --border:#f0f0ed;--input:#c8c8c4;--ring:#6c6c70;--sidebar:#ecece9;--sidebar-border:#e8e8e4;--sidebar-accent:#ffffff;
  --link:#2563eb;--success:#228b3b;--warning:#b7791f}
:root{--sk:color-mix(in srgb,var(--foreground) 9%,transparent);--line:color-mix(in srgb,var(--foreground) 11%,transparent)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--background);color:var(--foreground);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* mock-only view switcher */
.vbar{display:flex;gap:4px;align-items:center;min-height:44px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--card);font-size:12px;flex-wrap:wrap}
.vbar a{padding:5px 10px;border-radius:8px;color:var(--muted-foreground);text-decoration:none}
.vbar a.on{background:var(--accent);color:var(--foreground);font-weight:600}
.vbar .sep{width:1px;height:18px;background:var(--line);margin:0 6px}
.vbar .sp{flex:1}
body.embed .vbar{display:none}
/* shell */
.app{display:grid;grid-template-columns:316px minmax(0,1fr);min-height:900px}
body.embed .app,body.phone .app{grid-template-columns:minmax(0,1fr);min-height:0}
aside.sb{background:var(--sidebar);border-right:1px solid var(--sidebar-border);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.sb .search{height:36px;border-radius:10px;background:var(--accent);color:var(--muted-foreground);display:flex;align-items:center;gap:8px;padding:0 12px;margin:0 0 14px}
.nav{display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:12px;font-weight:600;font-size:14px}
.nav.on{background:var(--sidebar-accent)}
[data-theme="dark"] .nav.on{background:var(--sidebar-accent)}
.nav svg{color:var(--muted-foreground)}
.nav .n{margin-left:auto;font-size:11px;color:var(--destructive);font-weight:500}
.ws{display:flex;align-items:center;gap:8px;padding:14px 8px 6px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-top:1px solid var(--sidebar-border);margin-top:10px}
.bot{display:flex;gap:10px;padding:8px;align-items:center}
.bot .av{width:30px;height:30px;border-radius:50% 50% 45% 45%;flex:none}
.bot b{font-size:13px;font-weight:600;display:block}
.bot span{font-size:12px;color:var(--muted-foreground);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.sb .grow{flex:1}
.page{min-width:0;padding:20px 28px 40px}
body.embed .page,body.phone .page{padding:8px 16px 32px}
.menubtn{display:none;width:40px;height:40px;margin-left:-8px;border:0;background:transparent;place-items:center;color:var(--muted-foreground)}
body.embed aside.sb,body.phone aside.sb{display:none}
body.embed .menubtn,body.phone .menubtn{display:grid}
/* page header (real PageHeader structure) */
.ph{display:flex;flex-wrap:wrap;align-items:center;column-gap:12px;margin-bottom:16px}
.ph h1{margin:0;height:40px;display:flex;align-items:center;font-size:18px;font-weight:600;line-height:28px;order:1}
.ph .meta{order:2;flex:1;display:flex;align-items:center;gap:8px;min-width:0;font-size:12px;color:var(--muted-foreground)}
.ph .act{order:3;margin-left:auto;display:flex;gap:8px;align-items:center;justify-content:flex-end}
body.embed .ph .meta,body.phone .ph .meta{order:3;flex-basis:100%;padding-bottom:6px}
body.embed .ph .act,body.phone .ph .act{order:2}
.btn{height:32px;padding:0 12px;border-radius:10px;border:1px solid var(--input);background:transparent;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap}
.btn.p{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.ic{width:28px;padding:0;justify-content:center;border-color:transparent;color:var(--muted-foreground)}
.srcbtn{border:0;background:transparent;color:var(--muted-foreground);font-size:12px;display:inline-flex;align-items:center;gap:2px;padding:0 2px;height:28px}
.dot{opacity:.6}
/* cards: one width for every section */
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.attn{border-color:var(--foreground)}
.ch{display:flex;align-items:center;gap:8px;min-height:32px;margin-bottom:12px}
.ch h2{margin:0;font-size:14px;font-weight:600;margin-right:auto}
.ch .sub{font-size:12px;color:var(--muted-foreground);font-weight:400;margin-left:8px}
.hr{height:1px;background:var(--line);margin:16px 0}
/* skeletons: static placeholders, not loading */
.sk{display:block;height:10px;border-radius:6px;background:var(--sk)}
.sk.pill{height:20px;border-radius:999px}
.sk.circ{height:28px;width:28px;border-radius:50%}
.sk.bar{height:10px;border-radius:5px;width:100%}
/* source choice */
.choice{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choice .btn{height:44px;justify-content:flex-start;padding:0 14px;gap:10px;border-radius:12px;font-weight:600}
.choice .btn svg{color:var(--muted-foreground)}
/* figures */
.figs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.fig{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fig .l{font-size:12px;font-weight:600;color:var(--muted-foreground)}
.fig .v{font-size:22px;font-weight:600;line-height:1.2;margin-top:6px;font-variant-numeric:tabular-nums}
.fig .s{font-size:12px;color:var(--muted-foreground);margin-top:2px}
.fig .sk{margin-top:12px;height:18px;width:46%;border-radius:6px}
.fig .sk.b{height:10px;width:30%;margin-top:10px}
.own{display:flex;gap:2px;height:10px;border-radius:5px;overflow:hidden;margin-bottom:8px}
.own i{display:block;height:100%}
.legend{display:flex;gap:4px 16px;flex-wrap:wrap;font-size:12px;color:var(--muted-foreground);margin-bottom:12px}
.legend .sk{height:8px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.t0{background:var(--foreground)}.t1{background:var(--muted-foreground)}.t2{background:var(--input)}
.t3{background:repeating-linear-gradient(45deg,var(--muted-foreground) 0 1.5px,transparent 1.5px 3.5px)}
/* tables */
.tr{display:grid;grid-template-columns:minmax(0,1fr) 120px 110px 110px 110px 28px;gap:0 12px;align-items:center;min-height:44px;border-top:1px solid var(--line)}
.tr.th{min-height:32px;border-top:0;font-size:12px;color:var(--muted-foreground);font-weight:500}
.tr .r{text-align:right;font-variant-numeric:tabular-nums}
.tr .nm{font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .mu{color:var(--muted-foreground)}
.tr.grp{background:var(--accent);margin:0 -16px;padding:0 16px;font-weight:600}
.tr.grp .nm a{color:var(--muted-foreground);font-weight:400;font-size:12px;margin-left:8px}
.tr .sk{height:10px}
.tr .rt{display:flex;justify-content:flex-end}
.tr .psub{display:none}
.cell{display:inline-flex;justify-content:flex-end;align-items:center;min-width:84px;height:30px;padding:0 10px;border:1px solid var(--input);border-radius:8px;font-variant-numeric:tabular-nums}
.tr.add{color:var(--muted-foreground);font-weight:500}
.tr.add .nm{display:flex;align-items:center;gap:8px;grid-column:1/-1;color:var(--foreground)}
.saved{font-size:12px;color:var(--muted-foreground)}
/* update + contact rows */
.row{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span{display:block;font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx .sk{margin:3px 0}
.badge{height:22px;padding:0 9px;border-radius:999px;background:var(--accent);font-size:12px;font-weight:500;display:inline-flex;align-items:center}
.badge.ok{color:var(--success)}
.crow{display:grid;grid-template-columns:28px minmax(0,1.2fr) minmax(0,1.3fr) 140px 28px;gap:12px;align-items:center;min-height:52px;border-top:1px solid var(--line)}
.crow .tx b{display:block;font-weight:500}
.crow .tx span{display:block;font-size:12px;color:var(--muted-foreground)}
.crow .sk+.sk{margin-top:6px}
.ph-col{font-size:12px;color:var(--muted-foreground)}
.av2{width:28px;height:28px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:600}
.tabs{display:inline-flex;gap:2px;padding:3px;background:var(--accent);border-radius:16px}
.tabs button{border:0;background:transparent;height:26px;padding:0 12px;border-radius:13px;font-size:13px;color:var(--muted-foreground)}
.tabs button.on{background:var(--card);color:var(--foreground);font-weight:600}
.cbar{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.search2{margin-left:auto;height:30px;width:220px;border:1px solid var(--input);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--muted-foreground);font-size:13px}
/* fundraising */
.rbar{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;background:var(--sk)}
.rbar i{display:block;height:100%}
.rleg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
.rleg .l{font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px}
.rleg .l i{width:8px;height:8px;border-radius:50%;display:inline-block}
.rleg .v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.rleg .sk{height:16px;width:60%;margin-top:6px;border-radius:6px}
.stg{font-size:12px;font-weight:600;color:var(--muted-foreground);margin:14px 0 2px;display:flex;gap:8px}
.stg:first-of-type{margin-top:0}
.stg span{font-weight:400}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 110px 100px 28px;gap:12px;align-items:center;min-height:52px;border-top:1px solid var(--line)}
.prow .tx b{display:block;font-weight:500}
.prow .tx span{display:block;font-size:12px;color:var(--muted-foreground)}
.prow .sk+.sk{margin-top:6px}
.prow .r{text-align:right;font-variant-numeric:tabular-nums}
.prow .slot{display:flex;justify-content:flex-end}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 110px 90px 90px 28px;gap:12px;align-items:center;min-height:52px;border-top:1px solid var(--line)}
.srow .tx b{display:block;font-weight:500}
.srow .tx span{display:block;font-size:12px;color:var(--muted-foreground)}
.srow .tx .sk{margin:3px 0}
.srow .r{text-align:right;font-variant-numeric:tabular-nums}
.attn-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.attn-row .tx{flex:1;min-width:200px}
.lnk{color:var(--muted-foreground);text-decoration:underline;font-size:12px}
.cardfirst>.row:first-of-type,.cardfirst>.prow:first-of-type,.cardfirst>.srow:first-of-type,.cardfirst>.crow:first-of-type{border-top:0}
/* phone */
body.embed .choice,body.phone .choice{grid-template-columns:1fr}
body.embed .tr,body.phone .tr{grid-template-columns:minmax(0,1fr) auto 28px}
body.embed .tr .c-sec,body.embed .tr .c-sh,body.embed .tr .c-inv,body.phone .tr .c-sec,body.phone .tr .c-sh,body.phone .tr .c-inv{display:none}
body.embed .tr .psub,body.phone .tr .psub{display:block;font-size:12px;color:var(--muted-foreground);font-weight:400}
body.embed .tr .nm,body.phone .tr .nm{white-space:normal}
body.embed .tr.th .c-pct,body.phone .tr.th .c-pct{grid-column:2}
body.embed .tr.add .nm,body.phone .tr.add .nm{grid-column:1/-1}
body.embed .tr{padding:6px 0}body.phone .tr{padding:6px 0}
body.embed .tr.grp,body.phone .tr.grp{padding:6px 16px}
body.embed .crow,body.phone .crow{grid-template-columns:28px minmax(0,1fr) 28px}
body.embed .crow .c-em,body.embed .crow .c-pt,body.phone .crow .c-em,body.phone .crow .c-pt{display:none}
body.embed .figs,body.phone .figs{gap:8px}
body.embed .fig,body.phone .fig{padding:10px 12px}
body.embed .fig .v,body.phone .fig .v{font-size:19px}
body.embed .search2,body.phone .search2{margin-left:0;width:100%}
body.embed .rleg,body.phone .rleg{grid-template-columns:repeat(2,minmax(0,1fr))}
body.embed .prow,body.phone .prow{grid-template-columns:minmax(0,1fr) auto 28px}
body.embed .prow .slot,body.phone .prow .slot{display:none}
body.embed .srow,body.phone .srow{grid-template-columns:minmax(0,1fr) auto auto 28px}body.phone .vbar{display:none}body.embed .legend .sk:nth-child(3),body.phone .legend .sk:nth-child(3){display:none}
body.embed .srow .c-dt,body.phone .srow .c-dt{display:none}
.phoneframe{display:flex;justify-content:center;padding:24px;background:var(--background)}
.phoneframe iframe{width:390px;height:860px;border:1px solid var(--input);border-radius:28px;background:var(--background)}
</style>
</head>
<body>
<div class="vbar" id="vbar"></div>
<div id="root"></div>
<script>
const V = [
  ["a","A  Investors, empty"],["b","B  Typed in, empty table"],["c","C  Investors, populated"],["d","D  Phone of A"],
  null,
  ["e","E  Fundraising, no round"],["f","F  Fundraising, open round"],["g","G  Phone of F"]
];
const q = new URLSearchParams(location.search);
const embed = q.has("embed");
const sk = (w, cls="", h="") => `<i class="sk ${cls}" style="width:${w}${h?`;height:${h}`:""}"></i>`;
const ic = {
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>', plus:'<path d="M12 5v14M5 12h14"/>', more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>', down:'<path d="M6 9l6 6 6-6"/>', eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', carta:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/>', sheet:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/>', type:'<path d="M5 6h14M12 6v13M9 19h6"/>',
  fin:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>', legal:'<path d="M12 3v18M6 21h12M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z"/>',
  inv:'<circle cx="12" cy="12" r="9"/><path d="M12 12V3M12 12l7 5"/>', fund:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>', con:'<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10" r="2.5"/><path d="M8 17c1-2 2.5-3 4-3s3 1 4 3"/>',
  room:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>', art:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/>', int:'<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>'
};
const I = n => `<svg viewBox="0 0 24 24">${ic[n]}</svg>`;
const more = `<button class="btn ic" aria-label="Actions">${I("more")}</button>`;

function shell(active, inner) {
  const nav = [["fin","Finance"],["legal","Legal","1"],["inv","Investors"],["fund","Fundraising"],["con","Contacts"],["room","Data room","1"],["art","Artifacts"]]
    .map(([k,l,n]) => `<div class="nav ${l===active?"on":""}">${I(k)}${l}${n?`<span class="n">${n}</span>`:""}</div>`).join("");
  return `<div class="app"><aside class="sb"><div class="search">${I("search")}Search</div>${nav}
    <div class="ws">Northwind Robotics</div>
    <div class="bot"><i class="av" style="background:#3ecfb2"></i><div><b>Chief</b><span>Five open deals.</span></div></div>
    <div class="bot"><i class="av" style="background:#f26a2e"></i><div><b>Investors agent</b><span>Ask me about your cap table</span></div></div>
    <div class="bot"><i class="av" style="background:#e0457b"></i><div><b>Finance agent</b><span>Synced just now</span></div></div>
    <div class="grow"></div><div class="nav">${I("int")}Integrations</div></aside>
    <main class="page">${inner}</main></div>`;
}
const header = (title, meta, actions) => `<div class="ph"><button class="menubtn" aria-label="Open navigation">${I("menu")}</button><h1>${title}</h1><div class="meta">${meta||""}</div><div class="act">${actions}</div></div>`;
const askBtn = `<button class="btn">${I("chat")}Ask</button>`;

/* ---------- Investors pieces ---------- */
const srcMeta = (company, src) => `<span>${company}</span><span class="dot">·</span><button class="srcbtn">${src}${I("down")}</button>`;
const tHead = `<div class="tr th"><span>Holder</span><span class="c-sec">Security</span><span class="r c-sh">Shares</span><span class="r c-inv">Invested</span><span class="r c-pct">Fully diluted</span><span></span></div>`;
const skRow = (n) => Array.from({length:n}, () => `<div class="tr"><span>${sk("38%")}</span><span class="c-sec">${sk("56%")}</span><span class="c-sh rt">${sk("70%")}</span><span class="c-inv rt">${sk("60%")}</span><span class="rt">${sk("46px")}</span><span></span></div>`).join("");
const figsSkeleton = `<div class="figs"><div class="fig"><div class="l">Fully diluted</div>${sk("46%","","18px").replace('class="sk "','class="sk "')}${sk("32%","b")}</div><div class="fig"><div class="l">Equity raised</div>${sk("38%","","18px")}${sk("24%","b")}</div></div>`;
const ownSkeleton = `<div class="own">${sk("100%","bar")}</div><div class="legend">${sk("90px")}${sk("90px")}${sk("120px")}</div>`;

const capEmpty = `<section class="card"><div class="ch"><h2>Cap table</h2></div>
  <div class="choice"><button class="btn">${I("carta")}Connect Carta</button><button class="btn">${I("sheet")}Use a Google Sheet</button><button class="btn">${I("type")}Type it in</button></div>
  <div class="hr"></div>${figsSkeleton}${ownSkeleton}${tHead}${skRow(3)}</section>`;

const capTyped = `<section class="card"><div class="ch"><h2>Cap table</h2><span class="saved"></span></div>
  ${figsSkeleton}${ownSkeleton}${tHead}
  <div class="tr add"><span class="nm">${I("plus")}Add holder</span></div>
  ${skRow(2)}
  <div class="tr"><span class="nm mu">Unallocated pool</span><span class="c-sec mu">Pool</span><span class="c-sh rt"><span class="cell mu">—</span></span><span class="c-inv"></span><span class="rt">${sk("46px")}</span><span></span></div></section>`;

const updatesEmpty = `<section class="card cardfirst"><div class="ch"><h2>Updates</h2><button class="btn sm">${I("plus")}New update</button>${more}</div>
  ${[0,1].map(()=>`<div class="row"><div class="tx">${sk("42%","","11px")}${sk("24%")}</div>${sk("52px","pill")}<span style="width:28px"></span></div>`).join("")}</section>`;
const tabs = `<div class="tabs"><button class="on">Investors</button><button>Board</button><button>Auditors</button></div>`;
const contactsEmpty = `<section class="card cardfirst"><div class="ch"><h2>Contacts</h2></div><div class="cbar">${tabs}</div>

};
const frame = (v, th) => `<div class="phoneframe"><iframe src="index.html?embed&theme=${th}#${v}" title="Phone ${v}"></iframe></div>`;

function theme() { return q.get("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); }
function render() {
  const h = (location.hash || "#a").slice(1);
  const th = theme();
  document.documentElement.dataset.theme = th;
  document.body.classList.toggle("embed", embed);
  document.body.classList.toggle("phone", q.has("phone"));
  document.getElementById("vbar").innerHTML = V.map(v => v ? `<a href="#${v[0]}" class="${v[0]===h?"on":""}">${v[1]}</a>` : `<span class="sep"></span>`).join("")
    + `<span class="sp"></span><a href="?theme=${th==="dark"?"light":"dark"}#${h}">${th==="dark"?"Light":"Dark"}</a>`;
  document.getElementById("root").innerHTML = h==="d" ? frame("a", th) : h==="g" ? frame("f", th) : (views[h]||views.a)();
}
addEventListener("hashchange", render); render();
