<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inner display inbox and inbox agent</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ECEBE6}a:hover{color:#ffffff}
.glass{background:rgba(52,51,48,0.62);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,0.09);box-shadow:0 8px 24px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.08)}
.gbtn{width:44px;height:44px;border:0;background:transparent;color:#ECEBE6;display:flex;align-items:center;justify-content:center;border-radius:22px}
</style>
</helmet>
<div style="width: 890px; height: 626px; position: relative; overflow: hidden; background: #1C1C1A; color: #ECEBE6; font-family: Geist, system-ui, sans-serif">

  <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 435px; padding: 16px 18px 0 22px; box-sizing: border-box; display: flex; flex-direction: column">
    <div style="font-size: 26px; font-weight: 600; letter-spacing: -0.02em; padding-bottom: 6px">Inbox</div>
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
      <div style="font-size: 13px; font-weight: 600; color: #9C9A93; padding: 10px 0 4px">{{s.title}} <span style="font-weight: 400">{{s.count}}</span></div>
      <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
        <a href="#" style="display: flex; gap: 10px; align-items: center; padding: 9px 8px; border-radius: {{r.radius}}; background: {{r.bg}}; border-bottom: 1px solid rgba(236,235,230,0.1); text-decoration: none; color: #ECEBE6">
          <div style="width: 8px; height: 8px; border-radius: 4px; background: {{r.dot}}; flex-shrink: 0"></div>
          <div style="flex: 1; min-width: 0">
            <div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 15px; font-weight: {{r.weight}}">{{r.from}}</span><span style="font-size: 13px; color: #9C9A93">{{r.time}}</span></div>
            <div style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.subject}} <span style="color: #9C9A93">— {{r.snippet}}</span></div>
          </div>
        </a>
      </sc-for>
    </sc-for>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 435px; top: 0; bottom: 0; width: 20px; background: linear-gradient(90deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 50%, rgba(0,0,0,0) 100%)"></div>

  <div style="position: absolute; left: 455px; right: 70px; top: 0; bottom: 0; padding: 16px 8px 80px 14px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box">
    <div class="glass" style="align-self: flex-start; height: 44px; border-radius: 22px; padding: 0 14px 0 8px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600">
      <svg width="28" height="28" viewBox="-15 -15 259 259" aria-hidden="true" style="flex-shrink: 0"><path d="M74.27 40.27L154.27 40.27C195.14 40.27 228.27 73.4 228.27 114.27C228.27 155.14 195.14 188.27 154.27 188.27L74.27 188.27C33.4 188.27 0.27 155.14 0.27 114.27C0.27 73.4 33.4 40.27 74.27 40.27Z" fill="#3B82F6"></path><rect x="62" y="100" width="20" height="60" rx="10" fill="#1C1C1A"></rect><rect x="146" y="100" width="20" height="60" rx="10" fill="#1C1C1A"></rect></svg>
      Inbox agent
    </div>
    <div style="margin-top: auto; align-self: flex-end; max-width: 86%; background: #33322F; border-radius: 20px; padding: 10px 16px; font-size: 15px; line-height: 1.4">Reply to Ana: Thursday works, 10am.</div>
    <div style="background: #252523; border-radius: 20px; padding: 10px 16px; font-size: 15px; line-height: 1.4; max-width: 92%">Here is a draft. I have not sent it.</div>
    <div style="background: #252523; border: 1px solid #2E2D2A; border-radius: 20px; overflow: hidden; font-size: 14px">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; border-bottom: 1px solid #2E2D2A"><span style="font-weight: 600">Re: Pilot timeline</span><span style="font-size: 12px; color: #E9C46A">Needs approval</span></div>
      <div style="padding: 8px 16px; color: #9C9A93; border-bottom: 1px solid #2E2D2A">To <span style="color: #ECEBE6">Ana Ruiz</span></div>
      <div style="padding: 10px 16px; line-height: 1.45">Hi Ana, Thursday works. Let's start at 10am. I'll send an invite shortly.</div>
      <div style="display: flex; gap: 8px; justify-content: flex-end; padding: 0 12px 12px">
        <button style="background: #33322F; border: 0; width: 96px; height: 44px; border-radius: 22px; font-family: inherit; font-size: 15px; color: #ECEBE6">Save</button>
        <button style="width: 96px; height: 44px; border-radius: 22px; border: 0; background: #F1F0EB; color: #1C1C1A; font-family: inherit; font-size: 15px; font-weight: 600">Send</button>
      </div>
    </div>
  </div>

  <div class="glass" style="position: absolute; left: 463px; right: 72px; bottom: 12px; height: 52px; border-radius: 26px; display: flex; align-items: center; gap: 4px; padding: 4px 4px 4px 16px; box-sizing: border-box">
    <label for="m2" style="position: absolute; left: -9999px">Message Inbox agent</label>
    <input id="m2" placeholder="Message Inbox agent" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; font-family: inherit; font-size: 16px; color: #ECEBE6; outline: none">
    <button class="gbtn" aria-label="Dictate"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"></path><path d="M19 11a7 7 0 0 1-14 0"></path></svg></button>
  </div>

  <div style="position: absolute; right: 10px; top: 12px; bottom: 12px; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <div style="width: 34px; height: 64px; border-radius: 17px; background: #000000; display: flex; justify-content: center; padding-top: 10px; box-sizing: border-box" aria-hidden="true"><div style="width: 10px; height: 10px; border-radius: 5px; background: #1f1f1d"></div></div>
    <div style="font-size: 12px; font-weight: 600">9:41</div>
    <div class="glass" style="border-radius: 26px; padding: 4px; display: flex; flex-direction: column; gap: 2px; margin-top: 6px">
      <button class="gbtn" aria-label="Page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6M8 13h8M8 17h5"></path></svg></button>
      <button class="gbtn" aria-label="List"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="6" height="6" rx="1"></rect><path d="M3 17l2 2 4-4M13 6h8M13 12h8M13 18h8"></path></svg></button>
    </div>
    <div style="margin-top: auto"></div>
    <div class="glass" style="border-radius: 26px; padding: 4px">
      <button class="gbtn" aria-label="Agent actions"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="12" cy="19" r="1.7"></circle></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":890,"height":626}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (from, subject, snippet, time, unread, selected) => ({ from, subject, snippet, time, dot: unread ? '#F1F0EB' : 'transparent', weight: unread ? 600 : 400, bg: selected ? '#252523' : 'transparent', radius: selected ? '12px' : '0' });
    return {
      sections: [
        { title: 'Needs reply', count: '3', rows: [
          row('Ana Ruiz', 'Re: Pilot timeline', 'Can we move the kickoff to Thursday?', '10:30 AM', false, true),
          row('Jordan Lee', 'Intro: design partner', 'Happy to connect you two', '8:20 AM', false),
          row('Northwind Support', 'Your ticket was updated', 'We need one more detail', 'Oct 18', false)
        ] },
        { title: 'Other mail today', count: '24', rows: [
          row('Acme Payroll', 'Payment could not be scheduled', 'Bank details are missing', '3:25 PM', true),
          row('Example Weekly', 'Five tools worth trying', 'Notes, shaders, and more', '3:02 PM', true),
          row('Deals Daily', 'Last chance this week', 'Save on your next order', '2:41 PM', true)
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
