<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outer display home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ECEBE6}a:hover{color:#ffffff}
.glass{background:rgba(52,51,48,0.62);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,0.09);box-shadow:0 8px 24px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.08)}
.gbtn{width:44px;height:44px;border:0;background:transparent;color:#ECEBE6;display:flex;align-items:center;justify-content:center;border-radius:22px}
</style>
</helmet>
<div style="width: 466px; height: 678px; position: relative; overflow: hidden; background: #1C1C1A; color: #ECEBE6; font-family: Geist, system-ui, sans-serif">
  <div style="position: absolute; left: 72px; right: 0; top: 0; bottom: 0; padding: 18px 14px 0 4px; display: flex; flex-direction: column; gap: 6px">
    <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: #252523; text-decoration: none; color: #ECEBE6">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
      <div style="flex: 1">
        <div style="font-size: 16px; font-weight: 500">Inbox</div>
        <div style="font-size: 13px; color: #9C9A93">3 need reply</div>
      </div>
      <span style="font-size: 13px; color: #9C9A93; font-variant-numeric: tabular-nums">42</span>
    </a>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 10px 4px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #9C9A93">PERSONNEL</span>
    </div>
    <sc-for list="{{agents}}" as="a" hint-placeholder-count="6">
      <a href="#" style="display: flex; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 16px; text-decoration: none; color: #ECEBE6">
        <sc-if value="{{a.bot}}" hint-placeholder-val="{{true}}">
          <svg width="40" height="40" viewBox="-15 -15 259 259" aria-hidden="true" style="flex-shrink: 0"><path d="{{a.shape}}" fill="{{a.color}}"></path><rect x="62" y="100" width="20" height="60" rx="10" fill="#1C1C1A"></rect><rect x="146" y="100" width="20" height="60" rx="10" fill="#1C1C1A"></rect></svg>
        </sc-if>
        <sc-if value="{{a.app}}" hint-placeholder-val="{{false}}">
          <div style="width: 40px; height: 40px; border-radius: 12px; background: #2A2927; border: 1px solid #2E2D2A; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px; flex-shrink: 0; box-sizing: border-box">{{a.initial}}</div>
        </sc-if>
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 16px; font-weight: 500">{{a.name}}</span><span style="font-size: 12px; color: #9C9A93">{{a.time}}</span></div>
          <div style="font-size: 13px; color: #9C9A93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.preview}}</div>
        </div>
      </a>
    </sc-for>
  </div>

  <div style="position: absolute; left: 10px; top: 14px; bottom: 14px; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <div style="width: 34px; height: 64px; border-radius: 17px; background: #000000; display: flex; justify-content: center; padding-top: 10px; box-sizing: border-box" aria-hidden="true"><div style="width: 10px; height: 10px; border-radius: 5px; background: #1f1f1d"></div></div>
    <div style="font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums">9:41</div>
    <div class="glass" style="border-radius: 26px; padding: 4px; margin-top: 6px">
      <button class="gbtn" aria-label="Account"><span style="width: 30px; height: 30px; border-radius: 15px; background: #2A2927; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">AB</span></button>
    </div>
    <div class="glass" style="border-radius: 26px; padding: 4px; display: flex; flex-direction: column; gap: 2px">
      <button class="gbtn" aria-label="Activity"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></button>
      <button class="gbtn" aria-label="Search"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
      <button class="gbtn" aria-label="Artifacts"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 2H9a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V6z"></path><path d="M3 8v12a2 2 0 0 0 2 2h9"></path></svg></button>
    </div>
    <div style="margin-top: auto"></div>
    <div class="glass" style="border-radius: 26px; padding: 4px; background: rgba(241,240,235,0.92)">
      <button class="gbtn" aria-label="New" style="color: #1C1C1A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":466,"height":678}}'>
class Component extends DCLogic {
  renderVals() {
    const SH = { hex: 'M217.73 153.04Q217.73 174 199.58 184.48L132.42 223.25Q114.27 233.73 96.12 223.25L28.96 184.48Q10.81 174 10.81 153.04L10.81 75.5Q10.81 54.54 28.96 44.06L96.12 5.29Q114.27 -5.19 132.42 5.29L199.58 44.06Q217.73 54.54 217.73 75.5Z', wedge: 'M77.26 42.06Q114.27 -22.05 151.28 42.06L216.15 154.43Q253.17 218.53 179.14 218.53L49.4 218.53Q-24.62 218.53 12.39 154.43Z', teardrop: 'M125.97 7.2Q114.27 -7.28 102.57 7.2L43.49 80.31C13.46 117.46 17.28 171.51 52.23 204.08C87.17 236.65 141.37 236.65 176.32 204.08C211.26 171.51 215.08 117.46 185.05 80.31Z' };
    const bot = (name, shape, color, time, preview) => ({ name, shape: SH[shape], color, time, preview, bot: true, app: false });
    const app = (name, initial, time, preview) => ({ name, initial, time, preview, bot: false, app: true });
    return {
      agents: [
        bot('Chief', 'hex', '#3EC5A8', '2:59 PM', 'Hello! How can I help?'),
        bot('Finance agent', 'wedge', '#F5A03C', 'Yesterday', 'Runway summary for the last 30 days'),
        app('Carta agent', 'C', '2:44 PM', 'The option pool draft is ready'),
        bot('Legal agent', 'teardrop', '#9B5CF6', '7:51 AM', '2 deadlines due this week'),
        app('Mercury agent', 'M', '2:06 PM', 'Balance as of this morning: [AMOUNT]'),
        app('Brex agent', 'B', 'Yesterday', '4 card expenses need receipts')
      ]
    };
  }
}
</script>
</body>
</html>
