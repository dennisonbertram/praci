<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inner display sidebar and inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ECEBE6}a:hover{color:#ffffff}
.glass{background:rgba(52,51,48,0.62);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,0.09);box-shadow:0 8px 24px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.08)}
.gbtn{width:44px;height:44px;border:0;background:transparent;color:#ECEBE6;display:flex;align-items:center;justify-content:center;border-radius:22px}
</style>
</helmet>
<div style="width: 890px; height: 626px; position: relative; overflow: hidden; background: #1C1C1A; color: #ECEBE6; font-family: Geist, system-ui, sans-serif">

  <div class="glass" style="position: absolute; left: 10px; top: 10px; bottom: 10px; width: 277px; border-radius: 30px; background: rgba(34,34,32,0.85); display: flex; flex-direction: column; padding: 10px; box-sizing: border-box; gap: 2px">
    <div style="display: flex; align-items: center; gap: 4px; margin-bottom: 6px">
      <label for="sb" style="position: absolute; left: -9999px">Search</label>
      <div style="flex: 1; height: 40px; border-radius: 20px; background: #252523; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #9C9A93; font-size: 14px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input id="sb" placeholder="Search" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #ECEBE6; font-family: inherit; font-size: 14px; outline: none"></div>
      <button class="gbtn" aria-label="Create"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
    <sc-for list="{{pages}}" as="p" hint-placeholder-count="6">
      <a href="#" style="display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; border-radius: 12px; text-decoration: none; color: #ECEBE6; background: {{p.bg}}">
        <span style="width: 18px; height: 18px; color: #9C9A93; display: flex"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.icon}}"></path></svg></span>
        <span style="flex: 1; font-size: 15px">{{p.name}}</span>
        <span style="font-size: 12px; color: #9C9A93; font-variant-numeric: tabular-nums">{{p.meta}}</span>
      </a>
    </sc-for>
    <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #9C9A93; padding: 14px 12px 4px">PERSONNEL</div>
    <sc-for list="{{agents}}" as="a" hint-placeholder-count="4">
      <a href="#" style="display: flex; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 12px; text-decoration: none; color: #ECEBE6">
        <sc-if value="{{a.bot}}" hint-placeholder-val="{{true}}"><svg width="30" height="30" viewBox="-15 -15 259 259" aria-hidden="true" style="flex-shrink: 0"><path d="{{a.shape}}" fill="{{a.color}}"></path><rect x="62" y="100" width="20" height="60" rx="10" fill="#1C1C1A"></rect><rect x="146" y="100" width="20" height="60" rx="10" fill="#1C1C1A"></rect></svg></sc-if>
        <sc-if value="{{a.app}}" hint-placeholder-val="{{false}}"><div style="width: 30px; height: 30px; border-radius: 8px; background: #2A2927; border: 1px solid #2E2D2A; display: flex; align-items: center; justify-content: center; flex-shrink: 0; box-sizing: border-box; font-size: 12px; font-weight: 600; color: #ECEBE6">{{a.initial}}</div></sc-if>
        <div style="flex: 1; min-width: 0">
          <div style="display: flex; justify-content: space-between"><span style="font-size: 14px">{{a.name}}</span><span style="font-size: 11px; color: #9C9A93">{{a.time}}</span></div>
          <div style="font-size: 12px; color: #9C9A93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.preview}}</div>
        </div>
      </a>
    </sc-for>
    <a href="#" style="margin-top: auto; height: 40px; border-radius: 20px; background: #252523; display: flex; align-items: center; padding: 0 14px; text-decoration: none; color: #ECEBE6; font-size: 14px">Connect apps</a>
  </div>

  <div style="position: absolute; left: 297px; right: 70px; top: 0; bottom: 0; padding: 14px 10px 0 18px; display: flex; flex-direction: column; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 12px; padding: 4px 0 8px">
      <div style="font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Inbox</div>
      <label for="sm" style="position: absolute; left: -9999px">Search mail</label>
      <div style="flex: 1; height: 38px; border-radius: 19px; background: #252523; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #9C9A93"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input id="sm" placeholder="Search mail" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #ECEBE6; font-family: inherit; font-size: 14px; outline: none"></div>
    </div>
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
      <div style="font-size: 13px; font-weight: 600; color: #9C9A93; padding: 10px 0 4px">{{s.title}} <span style="font-weight: 400">{{s.count}}</span></div>
      <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
        <a href="#" style="display: flex; gap: 12px; align-items: center; padding: 9px 6px 9px 0; border-bottom: 1px solid rgba(236,235,230,0.1); text-decoration: none; color: #ECEBE6">
          <div style="width: 8px; height: 8px; border-radius: 4px; background: {{r.dot}}; flex-shrink: 0"></div>
          <div style="flex: 1; min-width: 0">
            <div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 15px; font-weight: {{r.weight}}">{{r.from}}</span><span style="font-size: 13px; color: #9C9A93; font-variant-numeric: tabular-nums">{{r.time}}</span></div>
            <div style="display: flex; gap: 8px; align-items: center"><span style="flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.subject}} <span style="color: #9C9A93">— {{r.snippet}}</span></span><sc-if value="{{r.label}}" hint-placeholder-val="{{false}}"><span style="flex-shrink: 0; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 999px; background: #2A2927; color: {{r.labelColor}}">{{r.labelText}}</span></sc-if></div>
          </div>
        </a>
      </sc-for>
    </sc-for>
  </div>

  <div style="position: absolute; right: 10px; top: 12px; bottom: 12px; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <div style="width: 34px; height: 64px; border-radius: 17px; background: #000000; display: flex; justify-content: center; padding-top: 10px; box-sizing: border-box" aria-hidden="true"><div style="width: 10px; height: 10px; border-radius: 5px; background: #1f1f1d"></div></div>
    <div style="font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums">9:41</div>
    <div class="glass" style="border-radius: 26px; padding: 4px; display: flex; flex-direction: column; gap: 2px; margin-top: 6px">
      <button class="gbtn" aria-label="Hide amounts"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      <button class="gbtn" aria-label="Important only"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"></path></svg></button>
      <button class="gbtn" aria-label="Filter"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M7 12h10M10 18h4"></path></svg></button>
      <button class="gbtn" aria-label="Compose"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.4 2.6a2 2 0 0 1 3 3L12 15l-4 1 1-4z"></path></svg></button>
    </div>
    <div style="margin-top: auto"></div>
    <div class="glass" style="border-radius: 26px; padding: 4px; background: rgba(241,240,235,0.92)">
      <button class="gbtn" aria-label="Ask Inbox agent" style="color: #1C1C1A"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":890,"height":626}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (from, subject, snippet, time, unread, labelText, labelColor) => ({ from, subject, snippet, time, dot: unread ? '#F1F0EB' : 'transparent', weight: unread ? 600 : 400, label: !!labelText, labelText: labelText || '', labelColor: labelColor || '#9C9A93' });
    const SH = { hex: 'M217.73 153.04Q217.73 174 199.58 184.48L132.42 223.25Q114.27 233.73 96.12 223.25L28.96 184.48Q10.81 174 10.81 153.04L10.81 75.5Q10.81 54.54 28.96 44.06L96.12 5.29Q114.27 -5.19 132.42 5.29L199.58 44.06Q217.73 54.54 217.73 75.5Z', wedge: 'M77.26 42.06Q114.27 -22.05 151.28 42.06L216.15 154.43Q253.17 218.53 179.14 218.53L49.4 218.53Q-24.62 218.53 12.39 154.43Z', teardrop: 'M125.97 7.2Q114.27 -7.28 102.57 7.2L43.49 80.31C13.46 117.46 17.28 171.51 52.23 204.08C87.17 236.65 141.37 236.65 176.32 204.08C211.26 171.51 215.08 117.46 185.05 80.31Z' };
    const bot = (name, shape, color, time, preview) => ({ name, shape: SH[shape], color, time, preview, bot: true, app: false });
    const app = (name, initial, time, preview) => ({ name, initial, time, preview, bot: false, app: true });
    return {
      pages: [
        { name: 'Inbox', meta: '42', bg: '#2A2927', icon: 'M3 5h18v14H3z M3 7l9 6 9-6' },
        { name: 'Finance', meta: '[N] mo', bg: 'transparent', icon: 'M4 20V10 M10 20V4 M16 20v-7 M3 20h18' },
        { name: 'Legal', meta: '2', bg: 'transparent', icon: 'M12 3v18 M5 21h14 M4 8h16 M4 8l-2 6a3 3 0 0 0 4 0z M20 8l-2 6a3 3 0 0 0 4 0z' },
        { name: 'Cap table', meta: '', bg: 'transparent', icon: 'M21 12A9 9 0 1 1 12 3v9z M14 2.5A9 9 0 0 1 21.5 10H14z' },
        { name: 'Data room', meta: '', bg: 'transparent', icon: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z' },
        { name: 'Artifacts', meta: '', bg: 'transparent', icon: 'M15 2H9a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V6z M3 8v12a2 2 0 0 0 2 2h9' }
      ],
      agents: [
        bot('Chief', 'hex', '#3EC5A8', '2:59 PM', 'Hello! How can I help?'),
        bot('Finance agent', 'wedge', '#F5A03C', 'Yesterday', 'Runway summary for 30 days'),
        app('Carta agent', 'C', '2:44 PM', 'Option pool draft is ready'),
        bot('Legal agent', 'teardrop', '#9B5CF6', '7:51 AM', '2 deadlines this week')
      ],
      sections: [
        { title: 'Needs reply', count: '3', rows: [
          row('Ana Ruiz', 'Re: Pilot timeline', 'Can we move the kickoff to Thursday?', '10:30 AM', false),
          row('Jordan Lee', 'Intro: design partner', 'Happy to connect you two this week', '8:20 AM', false),
          row('Northwind Support', 'Your ticket was updated', 'We need one more detail', 'Oct 18', false)
        ] },
        { title: 'Other mail today', count: '24', rows: [
          row('Acme Payroll', 'Payment could not be scheduled', 'Bank details are missing', '3:25 PM', true, 'Needs attention'),
          row('Example Weekly', 'Five tools worth trying', 'Notes, shaders, and more', '3:02 PM', true, 'Newsletter'),
          row('Deals Daily', 'Last chance this week', 'Save on your next order', '2:41 PM', true, 'Junk', '#E9C46A')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
