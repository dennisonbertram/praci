<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Outer display inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ECEBE6}a:hover{color:#ffffff}
.glass{background:rgba(52,51,48,0.62);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,0.09);box-shadow:0 8px 24px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.08)}
.gbtn{width:44px;height:44px;border:0;background:transparent;color:#ECEBE6;display:flex;align-items:center;justify-content:center;border-radius:22px}
</style>
</helmet>
<div style="width: 466px; height: 678px; position: relative; overflow: hidden; background: #1C1C1A; color: #ECEBE6; font-family: Geist, system-ui, sans-serif">
  <div style="position: absolute; left: 72px; right: 0; top: 0; bottom: 0; padding: 14px 14px 0 6px; display: flex; flex-direction: column">
    <div style="font-size: 28px; font-weight: 600; letter-spacing: -0.02em; padding: 4px 4px 10px">Inbox</div>
    <sc-for list="{{sections}}" as="s" hint-placeholder-count="2">
      <div style="font-size: 13px; font-weight: 600; color: #9C9A93; padding: 10px 4px 4px">{{s.title}} <span style="font-weight: 400">{{s.count}}</span></div>
      <sc-for list="{{s.rows}}" as="r" hint-placeholder-count="3">
        <a href="#" style="display: flex; gap: 10px; padding: 10px 4px; border-bottom: 1px solid rgba(236,235,230,0.1); text-decoration: none; color: #ECEBE6">
          <div style="width: 8px; flex-shrink: 0; padding-top: 7px"><div style="width: 8px; height: 8px; border-radius: 4px; background: {{r.dot}}"></div></div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 15px; font-weight: {{r.weight}}">{{r.from}}</span><span style="font-size: 13px; color: #9C9A93; font-variant-numeric: tabular-nums; flex-shrink: 0">{{r.time}}</span></div>
            <div style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.subject}}</div>
            <div style="display: flex; gap: 6px; align-items: center"><sc-if value="{{r.label}}" hint-placeholder-val="{{false}}"><div style="width: 6px; height: 6px; border-radius: 3px; background: {{r.labelColor}}; flex-shrink: 0"></div></sc-if><span style="font-size: 13px; color: #9C9A93; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.snippet}}</span></div>
          </div>
        </a>
      </sc-for>
    </sc-for>
  </div>

  <div style="position: absolute; left: 10px; top: 14px; bottom: 14px; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <div style="width: 34px; height: 64px; border-radius: 17px; background: #000000; display: flex; justify-content: center; padding-top: 10px; box-sizing: border-box" aria-hidden="true"><div style="width: 10px; height: 10px; border-radius: 5px; background: #1f1f1d"></div></div>
    <div style="font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums">9:41</div>
    <div class="glass" style="border-radius: 26px; padding: 4px; margin-top: 6px">
      <button class="gbtn" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
    </div>
    <div class="glass" style="border-radius: 26px; padding: 4px; display: flex; flex-direction: column; gap: 2px">
      <button class="gbtn" aria-label="Search mail"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
      <button class="gbtn" aria-label="Filter"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M7 12h10M10 18h4"></path></svg></button>
      <button class="gbtn" aria-label="Compose"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.4 2.6a2 2 0 0 1 3 3L12 15l-4 1 1-4z"></path></svg></button>
    </div>
    <div style="margin-top: auto"></div>
    <div class="glass" style="border-radius: 26px; padding: 4px; background: rgba(241,240,235,0.92)">
      <button class="gbtn" aria-label="Ask Inbox agent" style="color: #1C1C1A"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":466,"height":678}}'>
class Component extends DCLogic {
  renderVals() {
    const read = 'transparent', unread = '#F1F0EB';
    const row = (from, subject, snippet, time, isUnread, label, labelColor) => ({ from, subject, snippet, time, dot: isUnread ? unread : read, weight: isUnread ? 600 : 400, label: !!label, labelColor: labelColor || 'transparent' });
    return {
      sections: [
        { title: 'Needs reply', count: '3', rows: [
          row('Ana Ruiz', 'Re: Pilot timeline', 'Can we move the kickoff to Thursday?', '10:30 AM', false),
          row('Jordan Lee', 'Intro: design partner', 'Happy to connect you two this week', '8:20 AM', false),
          row('Northwind Support', 'Your ticket was updated', 'We need one more detail to finish', 'Oct 18', false)
        ] },
        { title: 'Other mail today', count: '24', rows: [
          row('Acme Payroll', 'Payment could not be scheduled', 'Bank details are missing for one person', '3:25 PM', true, 'Needs attention', '#9C9A93'),
          row('Example Weekly', 'Five tools worth trying', 'This week: notes, shaders, and more', '3:02 PM', true, 'Newsletter', '#9C9A93')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
