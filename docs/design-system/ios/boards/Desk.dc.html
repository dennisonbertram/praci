<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Laptop desk pose finance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ECEBE6}a:hover{color:#ffffff}
.glass{background:rgba(52,51,48,0.62);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,0.09);box-shadow:0 8px 24px rgba(0,0,0,0.35),inset 0 1px 0 rgba(255,255,255,0.08)}
.gbtn{width:44px;height:44px;border:0;background:transparent;color:#ECEBE6;display:flex;align-items:center;justify-content:center;border-radius:22px}
</style>
</helmet>
<div style="width: 626px; height: 890px; position: relative; overflow: hidden; background: #1C1C1A; color: #ECEBE6; font-family: Geist, system-ui, sans-serif">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 36px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600">
    <span>9:41</span>
    <div style="width: 96px; height: 26px; border-radius: 13px; background: #000000" aria-hidden="true"></div>
    <svg width="26" height="12" viewBox="0 0 26 12" aria-hidden="true"><rect x="0.5" y="0.5" width="22" height="11" rx="3" fill="none" stroke="#ECEBE6"></rect><rect x="2" y="2" width="17" height="8" rx="2" fill="#ECEBE6"></rect></svg>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 36px; height: 399px; padding: 8px 22px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Finance</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <div style="background: #252523; border-radius: 20px; padding: 14px 16px"><div style="font-size: 13px; color: #9C9A93">Runway</div><div style="font-size: 28px; font-weight: 600; margin-top: 4px">[N] mo</div></div>
      <div style="background: #252523; border-radius: 20px; padding: 14px 16px"><div style="font-size: 13px; color: #9C9A93">Cash</div><div style="font-size: 28px; font-weight: 600; margin-top: 4px">[AMOUNT]</div></div>
    </div>
    <div style="flex: 1; background: #252523; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; font-size: 13px; color: #9C9A93"><span>Monthly spend</span><span>Last 6 months</span></div>
      <div style="flex: 1; display: flex; align-items: flex-end; gap: 14px" role="img" aria-label="Bar chart of monthly spend, placeholder data">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="6">
          <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end">
            <div style="width: 100%; height: {{b.h}}; border-radius: 8px 8px 3px 3px; background: {{b.c}}"></div>
            <span style="font-size: 11px; color: #9C9A93">{{b.m}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 435px; height: 20px; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0) 100%)"></div>

  <div style="position: absolute; left: 0; right: 0; top: 455px; bottom: 0; padding: 12px 16px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 8px">
      <div class="glass" style="border-radius: 26px; padding: 2px">
        <button class="gbtn" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
      </div>
      <div class="glass" style="height: 48px; border-radius: 24px; padding: 0 14px 0 10px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600">
        <svg width="28" height="28" viewBox="-15 -15 259 259" aria-hidden="true" style="flex-shrink: 0"><path d="M77.26 42.06Q114.27 -22.05 151.28 42.06L216.15 154.43Q253.17 218.53 179.14 218.53L49.4 218.53Q-24.62 218.53 12.39 154.43Z" fill="#F5A03C"></path><rect x="62" y="100" width="20" height="60" rx="10" fill="#1C1C1A"></rect><rect x="146" y="100" width="20" height="60" rx="10" fill="#1C1C1A"></rect></svg>
        Finance agent
      </div>
      <div style="flex: 1"></div>
      <div class="glass" style="border-radius: 26px; padding: 2px; display: flex">
        <button class="gbtn" aria-label="Hide amounts"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        <button class="gbtn" aria-label="Agent actions"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg></button>
      </div>
    </div>
    <div style="margin-top: auto; align-self: flex-end; max-width: 80%; background: #33322F; border-radius: 20px; padding: 10px 16px; font-size: 15px; line-height: 1.4">Why did spend jump last month?</div>
    <div style="background: #252523; border-radius: 20px; padding: 12px 16px; font-size: 15px; line-height: 1.45; max-width: 92%">Two annual renewals landed in the same month, [AMOUNT] together. Without them, spend was flat.</div>
    <div class="glass" style="height: 52px; border-radius: 26px; display: flex; align-items: center; gap: 4px; padding: 4px 4px 4px 16px; box-sizing: border-box">
      <label for="m3" style="position: absolute; left: -9999px">Message Finance agent</label>
      <input id="m3" placeholder="Message Finance agent" style="flex: 1; min-width: 0; height: 44px; border: 0; background: transparent; font-family: inherit; font-size: 16px; color: #ECEBE6; outline: none">
      <button class="gbtn" aria-label="Dictate"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"></path><path d="M19 11a7 7 0 0 1-14 0"></path></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":626,"height":890}}'>
class Component extends DCLogic {
  renderVals() {
    const base = '#4A4944', hi = '#F1F0EB';
    return {
      bars: [
        { m: 'May', h: '52%', c: base }, { m: 'Jun', h: '58%', c: base }, { m: 'Jul', h: '55%', c: base },
        { m: 'Aug', h: '60%', c: base }, { m: 'Sep', h: '92%', c: hi }, { m: 'Oct', h: '57%', c: base }
      ]
    };
  }
}
</script>
</body>
</html>
