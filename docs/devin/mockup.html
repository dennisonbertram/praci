<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Devin Mockup</title>
<style>
:root{
  --background:#fafaf8; --foreground:#1a1a1a; --card:#ffffff; --primary:#1a1a1a; --primary-fg:#f1f1ef;
  --secondary:#f0f0ed; --muted:#f0f0ed; --muted-fg:#6c6c70;
  --accent:#eaeae6; --destructive:#dc2626; --border:#f0f0ed; --input:#c8c8c4; --ring:#6c6c70;
  --sidebar:#ecece9; --sidebar-border:#e8e8e4; --sidebar-accent:#ffffff;
  --success:#228b3b; --warning:#b7791f; --overlay:rgba(20,20,22,.45);
  --bot:#9B5CF6; --bot-fg:#111111;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --background:#1c1c1a; --foreground:#ecebe6; --card:#252523; --primary:#f1f0eb; --primary-fg:#1c1c1a;
    --secondary:#282826; --muted:#252523; --muted-fg:#9c9a93;
    --accent:#2a2927; --destructive:#f46262; --border:#2e2d2a; --input:#4a4944; --ring:#3b82f6;
    --sidebar:#222220; --sidebar-border:#2a2926; --sidebar-accent:#2a2927;
    --success:#4ecb71; --warning:#e9c46a; --overlay:rgba(8,8,7,.72);
  }
}
:root[data-theme="dark"]{
  --background:#1c1c1a; --foreground:#ecebe6; --card:#252523; --primary:#f1f0eb; --primary-fg:#1c1c1a;
  --secondary:#282826; --muted:#252523; --muted-fg:#9c9a93;
  --accent:#2a2927; --destructive:#f46262; --border:#2e2d2a; --input:#4a4944; --ring:#3b82f6;
  --sidebar:#222220; --sidebar-border:#2a2926; --sidebar-accent:#2a2927;
  --success:#4ecb71; --warning:#e9c46a; --overlay:rgba(8,8,7,.72);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--background);color:var(--foreground);font:14px/1.5 "Geist","Geist Variable",ui-sans-serif,system-ui,-apple-system,sans-serif}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg.i{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tab{font-variant-numeric:tabular-nums}

/* mockup chrome */
.mock{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center;padding:8px 16px;border-bottom:1px dashed var(--foreground);background:var(--card);position:sticky;top:0;z-index:50;font-size:12px}
.mock b{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-fg);margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:2px 12px;border-radius:6px;cursor:pointer;color:var(--muted-fg)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg)}
.cap{margin:36px auto 8px;padding:0 16px;max-width:1440px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-fg)}
.cap span{text-transform:none;letter-spacing:0;font-size:12px;display:block;margin-top:2px}
.wrapx{overflow-x:auto}

/* shell: a container so the layout follows the frame width, like the real app follows the window */
.fw{container:fw/inline-size;width:var(--w,1440px);margin:0 auto}
.shell{position:relative;display:flex;height:var(--h,900px);background:var(--background);overflow:hidden;border-block:1px solid var(--sidebar-border)}
aside.sb{width:316px;flex:none;background:var(--sidebar);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column}
.sbh{height:56px;display:flex;align-items:center;gap:4px;padding:0 10px;border-bottom:1px solid var(--sidebar-border)}
.pill{flex:none;width:185px;height:30px;border-radius:999px;background:var(--card);border:1px solid var(--sidebar-border);display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--muted-fg)}
.ibtn{width:34px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted-fg);flex:none}
.grp{display:flex;align-items:center;gap:4px;padding:10px 10px 4px 20px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:color-mix(in srgb,var(--muted-fg) 60%,transparent)}
.grp .sp{flex:1}
.nav{padding:0 8px}
.lnk{display:flex;align-items:center;gap:12px;border-radius:12px;padding:8px 10px;margin-bottom:4px;font-size:14px;font-weight:500;color:color-mix(in srgb,var(--foreground) 90%,transparent)}
.lnk.cur{background:var(--sidebar-accent)}
.lnk .tile{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:color-mix(in srgb,var(--foreground) 80%,transparent)}
.lnk .dot{margin-inline-start:auto;width:8px;height:8px;border-radius:50%;background:var(--primary)}
.sbdiv{border-top:1px solid var(--sidebar-border);margin:6px 0 8px}
.user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 20px;font-size:14px}
.user span{font-size:11px;color:var(--muted-fg)}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none;height:56px;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--sidebar-border)}
.bav{width:22px;height:22px;border-radius:7px;background:var(--bot);color:var(--bot-fg);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}

/* page */
main.pg{container:pg/inline-size;flex:1;min-height:0;overflow-y:auto;padding:20px 28px 24px}
.ph{display:flex;flex-wrap:wrap;align-items:center;column-gap:12px;margin-bottom:16px}
.ph h1{margin:0;height:40px;display:flex;align-items:center;font-size:18px;line-height:28px;font-weight:600}
.ph .meta{font-size:12px;color:var(--muted-fg)}
.ph .acts{margin-inline-start:auto;min-height:40px;display:flex;align-items:center;gap:8px}
.open .askbtn{display:none}
.btn{height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--background);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--muted)}
.btn.p{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.sm{height:28px;font-size:12.8px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px;max-width:520px}
.kpi{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:12px 14px;height:88px}
.kpi .t{font-size:12px;font-weight:600;color:var(--muted-fg)}
.kpi .v{margin-top:4px;font-size:22px;line-height:1.25;font-weight:600}
.kpi.em{border-color:var(--warning)}
.kpi.em .v{color:var(--warning)}
.errn{margin:16px 0;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--destructive);flex-wrap:wrap}
.sk{background:var(--muted);border-radius:6px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.center{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0;text-align:center}
.center p{margin:0;max-width:24rem;font-size:14px;color:var(--muted-fg)}

/* table (wide) and list (narrow), switched by the page's own width like Legal's @4xl */
table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:14px}
th{padding:8px 12px 8px 0;text-align:start;font-size:12px;font-weight:500;color:var(--muted-fg)}
td{padding:8px 12px 8px 0;vertical-align:top}
tr.row{border-top:1px solid var(--border);cursor:pointer}
tr.row:hover{background:color-mix(in srgb,var(--muted) 50%,transparent)}
tr.gl td{padding:16px 0 4px;font-size:12.5px;font-weight:500;color:color-mix(in srgb,var(--muted-fg) 80%,transparent)}
.ti{font-weight:500;display:block;overflow-wrap:anywhere}
tr.row:hover .ti,li.row:hover .ti{text-decoration:underline}
.sub{display:block;font-size:12px;color:var(--muted-fg)}
.q{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;color:var(--muted-fg)}
.ans{display:inline-flex;align-items:center;gap:3px;margin-top:2px;font-size:12px;color:var(--foreground);text-decoration:underline;text-underline-offset:2px}
.ans svg{width:11px;height:11px}
.badge{display:inline-flex;height:20px;align-items:center;gap:4px;border-radius:999px;border:1px solid var(--border);padding:0 8px;font-size:12px;font-weight:500;white-space:nowrap}
.badge.w{color:var(--warning);border-color:var(--warning)}
.badge.s{color:var(--success);border-color:var(--success)}
.badge.e{color:var(--destructive);background:color-mix(in srgb,var(--destructive) 10%,transparent);border-color:transparent}
.badge.m{color:var(--muted-fg)}
.badge.o{border-color:var(--input)}
.dim{color:var(--muted-fg)}
ul.nl{list-style:none;margin:0;padding:0;display:none}
li.row{border-top:1px solid var(--border);padding:12px 0;font-size:14px;cursor:pointer}
li.gl{padding:16px 0 4px;font-size:12.5px;font-weight:500;color:color-mix(in srgb,var(--muted-fg) 80%,transparent)}
li .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
li dl{margin:8px 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px}
li dt{color:var(--muted-fg)}li dd{margin:0}
@container pg (max-width:639px){ table.wd{display:none} ul.nl{display:block} }

/* docked / overlay panel */
aside.dock{display:none;width:384px;flex:none;border-left:1px solid var(--sidebar-border);background:var(--background);flex-direction:column;min-height:0}
.open aside.dock{display:flex}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px}
.dh .who{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
.thr{flex:1;overflow:auto;padding:8px 16px;display:flex;flex-direction:column;gap:24px}
.sep{text-align:center;font-size:12px;color:var(--muted-fg)}
.u{align-self:flex-end;max-width:84%;background:var(--bot);color:var(--bot-fg);border-radius:20px;padding:12px 18px;font-size:15.5px;line-height:1.45}
.a{align-self:flex-start;max-width:max(min(88%,100% - 8rem),min(88%,20rem));background:var(--muted);color:color-mix(in srgb,var(--foreground) 90%,transparent);border-radius:20px;padding:12px 18px;font-size:15.5px;line-height:1.5;display:flex;flex-direction:column;gap:10px}
.a p{margin:0}.a ul{margin:0;padding-inline-start:20px}.a li{margin:4px 0}
.a a{text-decoration:underline;text-underline-offset:2px}
.tools{align-self:flex-start;margin:-10px 0}
.tools summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:4px;min-height:24px;width:fit-content;font-size:13px;font-weight:500;color:var(--muted-fg)}
.tools summary::-webkit-details-marker{display:none}
.tools summary svg{width:14px;height:14px;transition:transform .15s}
.tools[open] summary svg{transform:rotate(90deg)}
.tools .body{margin:2px 0 0 7px;border-inline-start:1px solid var(--border);padding-inline-start:12px}
.tools .r{display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;color:var(--muted-fg)}
.tools .r svg{width:12px;height:12px;color:var(--success)}
.cmp{padding:12px 12px 16px}
.pillc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;border:1px solid var(--border);border-radius:26px;background:var(--background);padding:9px 10px 9px 12px}
.pillc .ph2{font-size:15.5px;line-height:24px;color:var(--muted-fg)}
.rb{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.rb.add{border:1px solid var(--border);background:var(--muted);color:var(--muted-fg)}
.rb.snd{background:color-mix(in srgb,var(--bot) 35%,var(--background));color:var(--bot-fg)}
.tr{display:flex;gap:4px;align-items:center}

/* responsive shell */
@container fw (max-width:1279px){
  aside.dock{position:absolute;top:0;right:0;bottom:0;max-width:100%;box-shadow:0 20px 25px -5px rgba(0,0,0,.2),0 8px 10px -6px rgba(0,0,0,.2)}
}
@container fw (max-width:1023px){
  aside.sb{display:none}
  .topbar{display:flex}
}
@container fw (max-width:767px){
  main.pg{padding:8px 16px 24px}
}

/* dialog + toast */
.scrim{background:var(--overlay);padding:48px 16px;display:grid;place-items:center;max-width:1440px;margin:0 auto}
.dlg{width:440px;max-width:100%;background:var(--card);border-radius:16px;padding:16px;position:relative;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.15)}
.dlg h3{margin:0;font-size:16px;font-weight:600;line-height:1.2}
.dlg p{margin:2px 0 0;color:var(--muted-fg)}
.dlg label{font-size:12px;display:block;margin-bottom:4px}
.dlg input{width:100%;height:36px;border:1px solid var(--input);border-radius:8px;background:var(--background);padding:0 10px;font-size:13px}
.dlg .x{position:absolute;top:14px;right:14px}
.dlg .help{display:inline-block;margin-top:4px;font-size:12px;color:var(--muted-fg)}
.dlg .help:hover{color:var(--foreground);text-decoration:underline}
.dlg .ft{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border);padding-top:12px}
.toast{position:absolute;right:16px;bottom:88px;width:min(28rem,calc(100% - 2rem));border:1px solid var(--border);border-radius:12px;background:var(--card);box-shadow:0 10px 15px -3px rgba(0,0,0,.15),0 4px 6px -4px rgba(0,0,0,.15);display:flex;gap:12px;padding:16px 40px 16px 16px;cursor:pointer}
.toast:hover{background:color-mix(in srgb,var(--muted) 40%,var(--card))}
.toast .tt{display:flex;align-items:baseline;gap:8px}
.toast .tt b{flex:1;font-size:14px;font-weight:500}
.toast .tt span{font-size:12px;color:var(--muted-fg)}
.toast .tb{margin-top:4px;font-size:14px;color:var(--muted-fg);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.toast .cl{position:absolute;top:8px;right:8px;width:24px;height:24px;display:grid;place-items:center;color:var(--muted-fg)}
</style>
</head>
<body>
<div class="mock" role="toolbar" aria-label="Mockup controls">
  <span><b>Mockup</b>Devin page</span>
  <span><b>Width</b><span class="seg" id="wd"></span></span>
  <span><b>Theme</b><span class="seg" id="th"></span></span>
</div>
<div id="root"></div>

<script>
const P={
 search:'<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>',
 clock:'<circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2 1.3"/>',
 side:'<rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M6.5 3v10"/>',
 plus:'<path d="M8 3v10M3 8h10"/>',
 chev:'<path d="M4 6l4 4 4-4"/>', more:'<path d="M3.5 8h.1M8 8h.1M12.5 8h.1"/>',
 inbox:'<path d="M2.5 4.5h11v8h-11zM2.5 4.5l5.5 4 5.5-4"/>', fin:'<path d="M2 13.5h12M4 11V7.5M8 11V3.5M12 11V6"/>',
 legal:'<path d="M8 2.5v11M4 13.5h8M3 5.5h10M3 5.5l-1.5 4h3zM13 5.5l-1.5 4h3z"/>', cap:'<circle cx="8" cy="8" r="5.5"/><path d="M8 2.5V8l4 3"/>',
 room:'<path d="M2.5 5.5h11v7.5h-11zM5.5 5.5V3.5h5v2"/>', dev:'<path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5M9 3.5l-2 9"/>',
 art:'<path d="M5 3.5h7v8H5zM3 5.5v8h7"/>', grid:'<rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/>',
 chat:'<path d="M2.5 3.5h11v7.5H7l-3 2.5V11H2.5z"/>', ext:'<path d="M9 3h4v4M13 3L7.5 8.5M11 9.5v3h-8v-8h3"/>',
 check:'<path d="M3.5 8.5l3 3 6-6.5"/>', x:'<path d="M4 4l8 8M12 4l-8 8"/>', arr:'<path d="M6 4l4 4-4 4"/>',
 mic:'<rect x="6" y="2.5" width="4" height="7" rx="2"/><path d="M3.5 8a4.5 4.5 0 0 0 9 0M8 12.5v1.5"/>', up:'<path d="M8 13V3.5M4 7l4-4 4 4"/>',
 menu:'<path d="M3 4.5h10M3 8h10M3 11.5h10"/>', pclose:'<rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M9.5 3v10M6 6.5L7.5 8 6 9.5"/>'
};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 16 16" aria-hidden="true">${P[n]}</svg>`;

function sidebar(dot){
 const l=(i,t,cur,d)=>`<div class="lnk${cur?' cur':''}"><span class="tile">${ic(i)}</span>${t}${d?'<span class="dot" aria-label="2 need you"></span>':''}</div>`;
 return `<aside class="sb"><div class="sbh"><div class="pill">${ic('search')}Search</div><span class="ibtn">${ic('clock')}</span><span class="ibtn">${ic('side')}</span><span class="ibtn">${ic('plus')}</span></div>
 <div class="grp">Pages<span class="sp"></span>${ic('chev')}${ic('more')}</div>
 <nav class="nav">${l('inbox','Inbox')}${l('fin','Finance')}${l('legal','Legal')}${l('cap','Cap table')}${l('room','Data room')}${l('dev','Devin',1,dot)}${l('art','Artifacts')}</nav>
 <div class="sbdiv"></div><nav class="nav">${l('grid','Integrations')}</nav>
 <div class="user"><span>DU</span>Demo User</div></aside>`;
}
const header=(meta,ask=true)=>`<div class="ph"><h1>Devin</h1><span class="meta">${meta}</span><div class="acts">${ask?`<button class="btn askbtn" data-ask>${ic('chat')}Ask</button>`:''}</div></div>`;
const tiles=(n,w)=>`<div class="kpis"><div class="kpi em"><div class="t">Needs you</div><div class="v tab">${n}</div></div><div class="kpi"><div class="t">Working</div><div class="v tab">${w}</div></div></div>`;
const SB={n:['w','Needs input'],w:['o','Working'],f:['s','Finished'],e:['e','Error'],s:['m','Suspended']};
const bd=k=>`<span class="badge ${SB[k][0]}">${SB[k][1]}</span>`;
const S=[
 {g:'Needs you',n:2},
 {t:'Add CSV export for invoices',k:'n',q:'Should the export keep the legacy CSV column order?',pr:null,src:'Slack',u:'12m ago'},
 {t:'Upgrade Prisma to 6.x',k:'n',q:'Two migrations conflict. Should I squash them or keep both and run the older one first?',pr:['acme/api#212','open'],src:'Linear',u:'1h ago'},
 {g:'Working',n:2},
 {t:'Remove unused feature flags',k:'w',pr:null,src:'Web',u:'1m ago'},
 {t:'Add pagination to the audit log API',k:'w',pr:['acme/api#215','open'],src:'Linear',u:'3m ago'},
 {g:'Earlier',n:4},
 {t:'Fix flaky invoice export test',k:'f',pr:['acme/web#418','merged'],src:'Slack',u:'2h ago'},
 {t:'Bump Expo SDK and move push notification setup to the new API',k:'f',pr:['acme/mobile#97','open'],src:'API',u:'Yesterday'},
 {t:'Migrate billing webhooks to the new queue',k:'e',pr:null,src:'Web',u:'Yesterday'},
 {t:'Rewrite onboarding copy',k:'s',pr:null,src:'Web',u:'2d ago'}];
const prc=pr=>pr?`<span>${pr[0]}</span><span class="sub">${pr[1]}</span>`:'<span class="dim">—</span>';
const ans=`<a class="ans" href="#" onclick="return false">Answer in Devin${ic('ext')}</a>`;
function table(){
 const cols=['36%','15%','21%','12%','16%'];
 let w=`<table class="wd"><colgroup>${cols.map(c=>`<col style="width:${c}">`).join('')}</colgroup><thead><tr><th>Session</th><th>Status</th><th>Pull request</th><th>Source</th><th>Updated</th></tr></thead><tbody>`;
 let n=`<ul class="nl" aria-label="Sessions">`;
 S.forEach(r=>{
  if(r.g){w+=`<tr class="gl"><td colspan="5">${r.g}</td></tr>`;n+=`<li class="gl">${r.g}</li>`;return}
  const first=`<a class="ti" href="#" onclick="return false">${r.t}</a>${r.q?`<span class="q">${r.q}</span>${ans}`:''}`;
  w+=`<tr class="row"><td>${first}</td><td>${bd(r.k)}</td><td>${prc(r.pr)}</td><td>${r.src}</td><td class="dim tab">${r.u}</td></tr>`;
  n+=`<li class="row"><div class="top"><div style="min-width:0">${first}</div>${bd(r.k)}</div><dl><dt>Pull request</dt><dd>${r.pr?r.pr[0]+' <span class="dim">'+r.pr[1]+'</span>':'<span class="dim">—</span>'}</dd><dt>Source</dt><dd>${r.src}</dd><dt>Updated</dt><dd class="tab">${r.u}</dd></dl></li>`;
 });
 return w+'</tbody></table>'+n+'</ul>';
}
const skel=()=>`<div aria-busy="true" style="display:flex;flex-direction:column;gap:12px"><div class="sk" style="height:28px;width:128px"></div><div class="kpis" style="margin:0"><div class="sk" style="height:80px"></div><div class="sk" style="height:80px"></div></div><div class="sk" style="height:224px"></div></div>`;
const err=(m,b)=>`<div role="alert" class="errn"><span>${m}</span><button class="btn sm">${b}</button></div>`;
const page=(inner)=>`<main class="pg">${inner}</main>`;
const topbar=`<div class="topbar"><span class="ibtn">${ic('menu')}</span><span class="bav">D</span><b style="font-weight:500">Devin agent</b></div>`;

function dock(){
 const tool=(l)=>`<div class="r">${ic('check')}${l}</div>`;
 return `<aside class="dock"><div class="dh"><div class="who"><span class="bav">D</span>Devin agent</div><span class="ibtn" style="width:28px;height:28px" data-close>${ic('pclose')}</span></div>
 <div class="thr"><div class="sep">Oct 20, 9:41 AM</div>
  <div class="u">Anything merged today?</div>
  <details class="tools"><summary>${ic('arr')}Done · 1 tool · 2s</summary><div class="body">${tool('Session search')}</div></details>
  <div class="a"><p>One pull request: <a href="#" onclick="return false">acme/web#418</a>, the flaky invoice export test fix.</p></div>
  <div class="u">What did Devin do on acme/api this week?</div>
  <details class="tools" open><summary>${ic('arr')}Done · 3 tools · 5s</summary><div class="body">${tool('Session search')}${tool('Session get messages ×2')}</div></details>
  <div class="a"><p>Two sessions touched acme/api:</p><ul>
   <li><b>Add pagination to the audit log API</b> opened <a href="#" onclick="return false">acme/api#215</a> and is still working. <a href="#" onclick="return false">Open in Devin</a></li>
   <li><b>Upgrade Prisma to 6.x</b> opened <a href="#" onclick="return false">acme/api#212</a> and is waiting on a question about two conflicting migrations. <a href="#" onclick="return false">Open in Devin</a></li></ul></div>
 </div>
 <div class="cmp"><div class="pillc"><span class="rb add">${ic('plus')}</span><span class="ph2">Message Devin agent</span><span class="tr"><span class="rb" style="color:var(--muted-fg)">${ic('mic')}</span><span class="rb snd">${ic('up')}</span></span></div></div></aside>`;
}
function frame({w='1440px',h='900px',dot=true,body,open=false,id='',extra=''}){
 return `<div class="wrapx"><div class="fw" ${id?`id="${id}"`:''} style="--w:${w};--h:${h}"><div class="shell${open?' open':''}">${sidebar(dot)}<div class="col">${topbar}${body}</div>${open||id?dock():''}${extra}</div></div></div>`;
}
const cap=(t,s)=>`<div class="cap">${t}${s?`<span>${s}</span>`:''}</div>`;
const mainBody=page(header('acme')+tiles(2,2)+table());
const stale=page(header('acme · Updated 4m ago')+err('Devin rejected the key.','Reconnect')+tiles(2,2)+table());
const notConn=page(header('')+`<div class="center"><p>Connect Devin to see its sessions here.</p><button class="btn p">Connect Devin</button></div>`);
const dialog=`<div class="scrim"><div class="dlg"><span class="x">${ic('x')}</span>
 <div><h3>Connect Devin</h3><p>An org-scoped Devin service-user key (starts with cog_).</p></div>
 <div><label for="k">API key</label><input id="k" type="password" value="cog_demo_key_0000"><a class="help" href="#" onclick="return false">Where to find your key</a></div>
 <div class="ft"><button class="btn">Cancel</button><button class="btn p">Connect</button></div></div></div>`;
const toast=`<div class="toast" role="status"><span class="bav" style="margin-top:2px">D</span><span style="min-width:0;flex:1"><span class="tt"><b>Devin has a question</b><span>now</span></span><div class="tb">Add CSV export for invoices: Should the export keep the legacy CSV column order?</div></span><span class="cl">${ic('x')}</span></div>`;

document.getElementById('root').innerHTML=
 cap('Devin page, panel open after Ask','Docked at 1280px and wider, overlays below; the sidebar becomes a drawer under 1024px; the table becomes a list at narrow page widths. Use the Width switcher.')+
 frame({id:'main',body:mainBody,open:true})+
 cap('First visit, panel closed')+frame({h:'560px',body:mainBody})+
 cap('Loading')+frame({h:'420px',dot:false,body:page(header('')+skel())})+
 cap('Empty')+frame({h:'360px',dot:false,body:page(header('acme')+`<div class="center"><p>No Devin sessions yet.</p></div>`)})+
 cap('Load error')+frame({h:'260px',dot:false,body:page(header('acme')+err('Could not load Devin sessions.','Try again'))})+
 cap('Key rejected, stale data','Header shows the update time only because the data is stale.')+frame({h:'760px',body:stale})+
 cap('Not connected')+frame({h:'360px',dot:false,body:notConn})+
 cap('Connect dialog','Connect closes the dialog and opens /app/devin.')+dialog+
 cap('Needs-you notification toast','Clicking opens that session in Devin (external) and marks the notification seen.')+frame({h:'560px',body:mainBody,extra:toast});

/* controls */
const th=document.getElementById('th'),wd=document.getElementById('wd');
function seg(el,vals,on){vals.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v;b.setAttribute('aria-pressed',i===0);b.onclick=()=>{el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));on(v)};el.append(b)})}
seg(th,['auto','light','dark'],v=>v==='auto'?document.documentElement.removeAttribute('data-theme'):document.documentElement.dataset.theme=v);
const mf=document.getElementById('main');
seg(wd,['1440','1100','900','390'],v=>{mf.style.setProperty('--w',v+'px');mf.firstElementChild.classList.toggle('open',+v>=1280)});
document.addEventListener('click',e=>{const s=e.target.closest('.shell');if(!s)return;
 if(e.target.closest('[data-ask]'))s.classList.add('open');if(e.target.closest('[data-close]'))s.classList.remove('open')});
</script>
</body>
</html>
