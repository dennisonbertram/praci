<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Devin Mockup</title>
<style>
:root{
  --background:#fafaf8; --foreground:#1a1a1a; --card:#ffffff; --primary:#1a1a1a; --primary-fg:#f1f1ef;
  --secondary:#f0f0ed; --muted:#f0f0ed; --muted-fg:#6c6c70;
  --accent:#eaeae6; --destructive:#dc2626; --border:#f0f0ed; --input:#c8c8c4; --ring:#6c6c70;
  --sidebar:#ecece9; --sidebar-border:#e8e8e4; --sidebar-accent:#ffffff;
  --success:#228b3b; --warning:#b7791f; --overlay:rgba(20,20,22,.45);
  --bot:#9B5CF6; --bot-fg:#111111;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --background:#1c1c1a; --foreground:#ecebe6; --card:#252523; --primary:#f1f0eb; --primary-fg:#1c1c1a;
    --secondary:#282826; --muted:#252523; --muted-fg:#9c9a93;
    --accent:#2a2927; --destructive:#f46262; --border:#2e2d2a; --input:#4a4944; --ring:#3b82f6;
    --sidebar:#222220; --sidebar-border:#2a2926; --sidebar-accent:#2a2927;
    --success:#4ecb71; --warning:#e9c46a; --overlay:rgba(8,8,7,.72);
  }
}
:root[data-theme="dark"]{
  --background:#1c1c1a; --foreground:#ecebe6; --card:#252523; --primary:#f1f0eb; --primary-fg:#1c1c1a;
  --secondary:#282826; --muted:#252523; --muted-fg:#9c9a93;
  --accent:#2a2927; --destructive:#f46262; --border:#2e2d2a; --input:#4a4944; --ring:#3b82f6;
  --sidebar:#222220; --sidebar-border:#2a2926; --sidebar-accent:#2a2927;
  --success:#4ecb71; --warning:#e9c46a; --overlay:rgba(8,8,7,.72);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--background);color:var(--foreground);font:14px/1.5 "Geist","Geist Variable",ui-sans-serif,system-ui,-apple-system,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
svg.i{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:11px;height:11px;vertical-align:-1px;margin-inline-start:3px}
.tab{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* mockup chrome */
.mock{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center;padding:8px 16px;border-bottom:1px dashed var(--foreground);background:var(--card);position:sticky;top:0;z-index:80;font-size:12px}
.mock b{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-fg);margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:2px 12px;border-radius:6px;color:var(--muted-fg)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-fg)}
.cap{margin:36px auto 8px;padding:0 16px;max-width:1440px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-fg)}
.cap span{text-transform:none;letter-spacing:0;font-size:12px;display:block;margin-top:2px}
.wrapx{overflow-x:auto}

/* shell: a container so the layout follows the frame width, like the real app follows the window */
.fw{container:fw/inline-size;width:var(--w,var(--fw,1440px));margin:0 auto}
.shell{position:relative;display:flex;height:var(--h,900px);background:var(--background);overflow:hidden;border-block:1px solid var(--sidebar-border)}
aside.sb{width:316px;flex:none;background:var(--sidebar);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column}
.sbh{height:56px;display:flex;align-items:center;gap:4px;padding:0 10px;border-bottom:1px solid var(--sidebar-border)}
.pill{flex:none;width:185px;height:30px;border-radius:999px;background:var(--card);border:1px solid var(--sidebar-border);display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--muted-fg)}
.ibtn{width:34px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted-fg);flex:none;border:0;background:transparent}
.sbh .closeb{display:none}
.grp{display:flex;align-items:center;gap:4px;padding:10px 10px 4px 20px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:color-mix(in srgb,var(--muted-fg) 60%,transparent)}
.grp .sp{flex:1}
.nav{padding:0 8px}
.lnk{display:flex;align-items:center;gap:12px;border-radius:12px;padding:8px 10px;margin-bottom:4px;font-size:14px;font-weight:500;color:color-mix(in srgb,var(--foreground) 90%,transparent)}
.lnk:hover{background:var(--sidebar-accent)}
.lnk.cur{background:var(--sidebar-accent)}
.lnk .tile{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:color-mix(in srgb,var(--foreground) 80%,transparent)}
.lnk .dot{margin-inline-start:auto;width:8px;height:8px;border-radius:50%;background:var(--primary)}
.sbdiv{border-top:1px solid var(--sidebar-border);margin:6px 0 8px}
.user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 20px;font-size:14px}
.user span{font-size:11px;color:var(--muted-fg)}
.col{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none;height:56px;align-items:center;padding:0 12px;flex:none}
.topbar .mb{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:color-mix(in srgb,var(--foreground) 75%,transparent);background:transparent;border:0}
.topbar .mb:hover{background:var(--accent)}
.bav{width:22px;height:22px;border-radius:7px;background:var(--bot);color:var(--bot-fg);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.drawscrim{display:none}

/* page */
main.pg{container:pg/inline-size;flex:1;min-height:0;overflow-y:auto;padding:20px 28px 24px}
.ph{display:flex;flex-wrap:wrap;align-items:center;column-gap:12px;margin-bottom:16px}
.ph h1{margin:0;height:40px;display:flex;align-items:center;font-size:18px;line-height:28px;font-weight:600}
.ph .meta{font-size:12px;color:var(--muted-fg)}
.ph .acts{margin-inline-start:auto;min-height:40px;display:flex;align-items:center;gap:8px}
.open .askbtn{display:none}
.btn{height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--background);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--muted)}
.btn.p{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.p:hover{opacity:.9;background:var(--primary)}
.btn.sm{height:28px;font-size:12.8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.ghost{background:transparent;border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:12px 14px;height:88px}
.kpi .t{font-size:12px;font-weight:600;color:var(--muted-fg)}
.kpi .v{margin-top:4px;font-size:22px;line-height:1.25;font-weight:600}
.kpi.em{border-color:var(--warning)}
.kpi.em .v{color:var(--warning)}
.errn{margin:16px 0;min-height:88px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--destructive);flex-wrap:wrap}
.sk{background:var(--accent);border-radius:6px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.center{display:flex;flex-direction:column;align-items:center;gap:12px;padding:40px 0;text-align:center}
.center p{margin:0;max-width:24rem;font-size:14px;color:var(--muted-fg)}
.lk{color:var(--muted-fg);text-decoration:underline;text-underline-offset:2px;font-size:14px}
.lk:hover{color:var(--foreground)}

/* table (wide) and list (narrow), switched by the page's own width like Legal's @4xl */
table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:14px}
th{padding:8px 12px 8px 0;text-align:start;font-size:12px;font-weight:500;color:var(--muted-fg)}
td{padding:8px 12px 8px 0;vertical-align:top}
tr.row{position:relative;border-top:1px solid var(--border)}
tr.row:hover,li.row:hover{background:color-mix(in srgb,var(--muted) 50%,transparent)}
tr.gl td{padding:16px 0 4px;font-size:12.5px;font-weight:500;color:color-mix(in srgb,var(--muted-fg) 80%,transparent)}
.ti{font-weight:500;display:inline;overflow-wrap:anywhere}
.ti::after{content:"";position:absolute;inset:0}
.row:hover .ti{text-decoration:underline}
.nw{white-space:nowrap}
.sub{display:block;font-size:12px;color:var(--muted-fg)}
.q{display:block;font-size:12px;color:var(--muted-fg)}
.badge{display:inline-flex;height:20px;align-items:center;gap:4px;border-radius:999px;border:1px solid var(--border);padding:0 8px;font-size:12px;font-weight:500;white-space:nowrap}
.badge.w{color:var(--warning);border-color:var(--warning)}
.badge.s{color:var(--success);border-color:var(--success)}
.badge.e{color:var(--destructive);background:color-mix(in srgb,var(--destructive) 10%,transparent);border-color:transparent}
.badge.m{color:var(--muted-fg)}
.badge.o{border-color:var(--input)}
.stale .badge{color:var(--muted-fg);border-color:var(--border);background:transparent}
.stale .ti,.stale td,.stale li{color:var(--muted-fg)}
.dim{color:var(--muted-fg)}
ul.nl{list-style:none;margin:0;padding:0;display:none}
li.row{position:relative;border-top:1px solid var(--border);padding:12px 0;font-size:14px}
li.gl{padding:16px 0 4px;font-size:12.5px;font-weight:500;color:color-mix(in srgb,var(--muted-fg) 80%,transparent)}
li .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
li .mt{margin-top:6px;font-size:12px;color:var(--muted-fg)}
@container pg (max-width:639px){ table.wd{display:none} ul.nl{display:block} }

/* docked / overlay panel */
aside.dock{display:none;width:384px;flex:none;border-left:1px solid var(--sidebar-border);background:var(--background);flex-direction:column;min-height:0}
.open aside.dock{display:flex}
.dh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 16px;flex:none}
.dh .who{display:flex;min-width:0;align-items:center;gap:8px;margin-inline:-6px;padding:4px 6px;border-radius:8px;font-size:14px;font-weight:500;background:transparent;border:0}
.dh .who:hover{background:var(--accent)}
.dh .who span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl28{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--foreground);background:transparent;border:0}
.cl28:hover{background:var(--muted)}
.intro{display:flex;flex-direction:column;gap:12px;padding:8px 16px 16px;flex:none}
.intro p{margin:0;font-size:14px;color:var(--muted-fg)}
.intro .sg{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.intro .btn{height:auto;max-width:100%;padding:6px 10px;text-align:start;white-space:normal;font-size:12.8px}
.thr{flex:1;overflow:auto;padding:8px 16px;display:flex;flex-direction:column;gap:24px}
.sep{text-align:center;font-size:12px;color:var(--muted-fg)}
.u{align-self:flex-end;max-width:84%;background:var(--bot);color:var(--bot-fg);border-radius:20px;padding:12px 18px;font-size:15.5px;line-height:1.45}
.a{align-self:flex-start;max-width:max(min(88%,100% - 8rem),min(88%,20rem));background:var(--muted);color:color-mix(in srgb,var(--foreground) 90%,transparent);border-radius:20px;padding:12px 18px;font-size:15.5px;line-height:1.5;display:flex;flex-direction:column;gap:10px}
.a p{margin:0}.a ul{margin:0;padding-inline-start:20px}.a li{margin:4px 0}
.a a{text-decoration:underline;text-underline-offset:2px}
.tools{align-self:flex-start;margin:-10px 0}
.tools summary{list-style:none;display:flex;align-items:center;gap:4px;min-height:24px;width:fit-content;font-size:13px;font-weight:500;color:var(--muted-fg);cursor:pointer}
.tools summary::-webkit-details-marker{display:none}
.tools summary svg{width:14px;height:14px;transition:transform .15s}
.tools[open] summary svg{transform:rotate(90deg)}
.tools .body{margin:2px 0 0 7px;border-inline-start:1px solid var(--border);padding-inline-start:12px}
.tools .r{display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;color:var(--muted-fg)}
.tools .r svg{width:12px;height:12px;color:var(--success)}
.tools .r.run svg{color:var(--warning);animation:pulse 1.5s ease-in-out infinite}
.tools .r.run span{animation:pulse 1.5s ease-in-out infinite}
.cmp{padding:12px 12px 16px;flex:none}
.pillc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;border:1px solid var(--border);border-radius:26px;background:var(--background);padding:9px 10px 9px 12px}
.pillc .ph2{font-size:15.5px;line-height:24px;color:var(--muted-fg)}
.rb{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;border:0;background:transparent}
.rb.add{border:1px solid var(--border);background:var(--muted);color:var(--muted-fg)}
.rb.mic{color:var(--muted-fg);border:1px solid var(--border)}
.rb.snd{background:color-mix(in srgb,var(--bot) 22%,var(--background));color:color-mix(in srgb,var(--bot-fg) 30%,transparent)}
.rb.stop{background:var(--accent);color:var(--foreground)}
.tr{display:flex;gap:4px;align-items:center}
.miss{flex:1;display:grid;place-content:center;justify-items:center;gap:12px;padding:0 20px;text-align:center}

/* responsive shell */
@container fw (max-width:1279px){
  aside.dock{position:absolute;top:0;right:0;bottom:0;z-index:30;max-width:100%;box-shadow:0 20px 25px -5px rgba(0,0,0,.2),0 8px 10px -6px rgba(0,0,0,.2)}
}
@container fw (max-width:1023px){
  aside.sb{display:none}
  .topbar{display:flex}
  .drawer aside.sb{display:flex;position:absolute;inset:0 auto 0 0;z-index:40;width:calc(100% - 48px);max-width:316px}
  .drawer .sbh .closeb{display:grid}
  .drawer .sbh .hideb{display:none}
  .drawer .drawscrim{display:block;position:absolute;inset:0 0 0 min(calc(100% - 48px),316px);z-index:30;background:var(--overlay);border:0}
}
@container fw (max-width:767px){
  main.pg{padding:8px 16px 24px}
}

/* dialog (real: bg-black/10 + blur-xs overlay, 384px, rounded-xl, ring, tinted footer) */
.dscrim{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.1);backdrop-filter:blur(2px);display:grid;place-items:center;padding:16px}
.dlgrow{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;padding:40px 16px;background:var(--background);border-block:1px solid var(--sidebar-border)}
.dlg{width:min(384px,100%);position:relative;display:grid;gap:16px;border-radius:12px;background:var(--card);padding:16px;font-size:14px;box-shadow:0 0 0 1px color-mix(in srgb,var(--foreground) 10%,transparent)}
.dlg .hd{display:flex;flex-direction:column;gap:8px}
.dlg .tl{display:flex;align-items:center;gap:12px}
.dlg .logo{width:40px;height:40px;border-radius:8px;background:var(--muted);color:var(--muted-fg);display:grid;place-items:center;font-weight:500}
.dlg h3{margin:0;font-size:16px;line-height:1;font-weight:500}
.dlg .ds{margin:0;color:var(--muted-fg)}
.dlg form{display:contents}
.dlg .f{display:flex;flex-direction:column;gap:4px}
.dlg input{width:100%;height:32px;border:1px solid var(--input);border-radius:8px;background:transparent;padding:0 10px;font-size:14px}
.dlg input::placeholder{color:var(--muted-fg)}
.dlg .help{font-size:12px;color:var(--muted-fg);width:fit-content}
.dlg .help:hover{color:var(--foreground);text-decoration:underline}
.dlg .er{margin:0;font-size:14px;color:var(--destructive)}
.dlg .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:transparent;border:0}
.dlg .x:hover{background:var(--muted)}
.dlg .ft{margin:0 -16px -16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border);border-radius:0 0 12px 12px;background:color-mix(in srgb,var(--muted) 50%,transparent);padding:16px}

/* toast (real notification-toaster markup) */
.tview{position:absolute;right:16px;bottom:88px;width:min(28rem,calc(100% - 2rem));z-index:50}
.toast{position:absolute;inset-inline:0;bottom:0;border:1px solid var(--border);border-radius:12px;background:var(--card);box-shadow:0 10px 15px -3px rgba(0,0,0,.15),0 4px 6px -4px rgba(0,0,0,.15)}
.toast.behind{transform:translateY(-1rem) scale(.95);transform-origin:bottom;background:var(--muted);border-color:color-mix(in srgb,var(--foreground) 25%,transparent)}
.toast .bt{display:flex;width:100%;align-items:flex-start;gap:12px;border:0;background:transparent;text-align:left;padding:16px 40px 16px 16px;border-radius:12px}
.toast .bt:hover{background:color-mix(in srgb,var(--muted) 40%,transparent)}
.toast .av{flex:none;width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;font-size:12px}
.toast .tt{display:flex;align-items:baseline;gap:8px}
.toast .tt b{flex:1;font-size:14px;font-weight:500}
.toast .tt span{font-size:12px;color:var(--muted-fg)}
.toast .tb{margin-top:4px;font-size:14px;color:var(--muted-fg)}
.toast .hint{margin-top:4px;font-size:12px;color:var(--muted-fg)}
.toast .cl{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:4px;display:grid;place-items:center;color:var(--muted-fg);background:transparent;border:0;opacity:0}
.toast:hover .cl,.toast:focus-within .cl{opacity:1}
.toast .cl:hover{background:var(--muted);color:var(--foreground)}
.toast .plus{position:absolute;top:-36px;right:12px;border:1px solid var(--border);border-radius:999px;background:var(--card);padding:2px 8px;font-size:12px;color:var(--muted-fg)}
.dimpg{opacity:1}
</style>
</head>
<body>
<div class="mock" role="toolbar" aria-label="Mockup controls">
  <span><b>Mockup</b>Devin page</span>
  <span><b>Width</b><span class="seg" id="wd"></span></span>
  <span><b>Theme</b><span class="seg" id="th"></span></span>
</div>
<div id="root"></div>

<script>
const P={
 search:'<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>',
 clock:'<circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2 1.3"/>',
 side:'<rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M6.5 3v10"/>',
 plus:'<path d="M8 3v10M3 8h10"/>',
 chev:'<path d="M4 6l4 4 4-4"/>', more:'<path d="M3.5 8h.1M8 8h.1M12.5 8h.1"/>',
 inbox:'<path d="M2.5 4.5h11v8h-11zM2.5 4.5l5.5 4 5.5-4"/>', fin:'<path d="M2 13.5h12M4 11V7.5M8 11V3.5M12 11V6"/>',
 legal:'<path d="M8 2.5v11M4 13.5h8M3 5.5h10M3 5.5l-1.5 4h3zM13 5.5l-1.5 4h3z"/>', cap:'<circle cx="8" cy="8" r="5.5"/><path d="M8 2.5V8l4 3"/>',
 room:'<path d="M2.5 5.5h11v7.5h-11zM5.5 5.5V3.5h5v2"/>', dev:'<path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5M9 3.5l-2 9"/>',
 art:'<path d="M5 3.5h7v8H5zM3 5.5v8h7"/>', grid:'<rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/>',
 chat:'<path d="M2.5 3.5h11v7.5H7l-3 2.5V11H2.5z"/>', ext:'<path d="M9 3h4v4M13 3L7.5 8.5M11 9.5v3h-8v-8h3"/>',
 check:'<path d="M3.5 8.5l3 3 6-6.5"/>', clk:'<circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2 1.3"/>', x:'<path d="M4 4l8 8M12 4l-8 8"/>', arr:'<path d="M6 4l4 4-4 4"/>',
 mic:'<rect x="6" y="2.5" width="4" height="7" rx="2"/><path d="M3.5 8a4.5 4.5 0 0 0 9 0M8 12.5v1.5"/>', up:'<path d="M8 13V3.5M4 7l4-4 4 4"/>',
 menu:'<path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/>', pclose:'<rect x="2.5" y="3" width="11" height="10" rx="2"/><path d="M9.5 3v10M6 6.5L7.5 8 6 9.5"/>',
 sq:'<rect x="4.5" y="4.5" width="7" height="7" rx="1" fill="currentColor"/>'
};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 16 16" aria-hidden="true">${P[n]}</svg>`;
const X=ic('ext','s');

function sidebar(cur,dot){
 const l=(i,t,c,d)=>`<a class="lnk${c?' cur':''}" href="#" onclick="return false"><span class="tile">${ic(i)}</span>${t}${d?'<span class="dot" aria-hidden="true"></span><span class="sr">new</span>':''}</a>`;
 return `<aside class="sb"><div class="sbh"><div class="pill">${ic('search')}Search</div><button class="ibtn" aria-label="History">${ic('clock')}</button><button class="ibtn hideb" aria-label="Hide sidebar">${ic('side')}</button><button class="ibtn" aria-label="New">${ic('plus')}</button><button class="ibtn closeb" aria-label="Close menu" data-drawer-close>${ic('x')}</button></div>
 <div class="grp">Pages<span class="sp"></span>${ic('chev')}${ic('more')}</div>
 <nav class="nav">${l('inbox','Inbox',cur==='inbox')}${l('fin','Finance')}${l('legal','Legal')}${l('cap','Cap table')}${l('room','Data room')}${l('dev','Devin',cur==='dev',dot)}${l('art','Artifacts')}</nav>
 <div class="sbdiv"></div><nav class="nav">${l('grid','Integrations')}</nav>
 <div class="user"><span>DU</span>Demo User</div></aside>`;
}
const header=(meta,ask=true)=>`<div class="ph"><h1>Devin</h1>${meta?`<span class="meta" title="Devin org">${meta.startsWith('acme')?'<span class="sr">Devin org </span>':''}${meta}</span>`:''}<div class="acts">${ask?`<button class="btn askbtn" data-ask>${ic('chat')}Ask</button>`:''}</div></div>`;
const tiles=(n,w)=>`<div class="kpis"><div class="kpi em"><div class="t">Needs you</div><div class="v tab">${n}</div></div><div class="kpi"><div class="t">Working</div><div class="v tab">${w}</div></div></div>`;
const SB={n:['w','Needs input'],w:['o','Working'],f:['s','Finished'],e:['e','Error'],s:['m','Suspended']};
const bd=k=>`<span class="badge ${SB[k][0]}">${SB[k][1]}</span>`;
const rowsFor=stale=>[
 {g:'Needs you'},
 {t:'Add CSV export for invoices',k:'n',q:'Should the export keep the legacy CSV column order?',pr:null,src:'Slack',u:stale?'14m ago':'2m ago'},
 {t:'Upgrade Prisma to 6.x',k:'n',q:'Two migrations conflict. Should I squash them or keep both and run the older one first?',pr:['acme/api#212','open'],src:'Linear',u:'1h ago'},
 {t:'Migrate billing webhooks to the new queue',k:'e',pr:null,src:'Web',u:'Yesterday'},
 {g:'Working'},
 {t:'Remove unused feature flags',k:'w',pr:null,src:'Web',u:stale?'9m ago':'1m ago'},
 {t:'Add pagination to the audit log API',k:'w',pr:['acme/api#215','open'],src:'Linear',u:stale?'12m ago':'3m ago'},
 {g:'Earlier'},
 {t:'Fix flaky invoice export test',k:'f',pr:['acme/web#418','merged'],src:'Slack',u:'2h ago'},
 {t:'Bump Expo SDK and move push notification setup to the new API',k:'f',pr:['acme/mobile#97','open'],src:'API',u:'Yesterday'},
 {t:'Rewrite onboarding copy',k:'s',pr:null,src:'Web',u:'2d ago'}];
const prc=pr=>pr?`<span>${pr[0]}</span><span class="sub">${pr[1]}</span>`:'<span class="dim">—</span>';
function table(stale){
 const cols=['36%','15%','21%','12%','16%'];
 let w=`<table class="wd"><colgroup>${cols.map(c=>`<col style="width:${c}">`).join('')}</colgroup><thead><tr><th>Session</th><th>Status</th><th>Pull request</th><th>Source</th><th>Updated</th></tr></thead><tbody>`;
 let n=`<ul class="nl" aria-label="Sessions">`;
 rowsFor(stale).forEach(r=>{
  if(r.g){w+=`<tr class="gl"><td colspan="5">${r.g}</td></tr>`;n+=`<li class="gl">${r.g}</li>`;return}
  const first=`<a class="ti" href="#" onclick="return false">${r.t.replace(/(\S+)$/,'<span class="nw">$1'+X+'</span>')}<span class="sr"> (opens in Devin)</span></a>${r.q?`<span class="q">${r.q}</span>`:''}`;
  w+=`<tr class="row"><td>${first}</td><td>${bd(r.k)}</td><td>${prc(r.pr)}</td><td>${r.src}</td><td class="dim tab">${r.u}</td></tr>`;
  n+=`<li class="row"><div class="top"><div style="min-width:0">${first}</div>${bd(r.k)}</div><div class="mt tab">${r.pr?r.pr[0]+' '+r.pr[1]+' · ':''}${r.u}</div></li>`;
 });
 return w+'</tbody></table>'+n+'</ul>';
}
const skel=()=>`<div aria-busy="true"><div class="ph"><h1>Devin</h1><span class="sk" style="width:48px;height:16px"></span></div><div class="kpis"><div class="sk" style="height:88px;border-radius:12px"></div><div class="sk" style="height:88px;border-radius:12px"></div></div><div style="display:flex;flex-direction:column;gap:12px;margin-top:24px">${[0,1,2,3,4,5].map(()=>`<div class="sk" style="height:40px"></div>`).join('')}</div></div>`;
const err=(m,b)=>`<div role="alert" class="errn"><span>${m}</span><button class="btn sm">${b}</button></div>`;
const page=inner=>`<main class="pg">${inner}</main>`;
const topbar=`<div class="topbar"><button class="mb" aria-label="Open navigation" data-drawer-open>${ic('menu').replace('class="i "','class="i" style="width:19px;height:19px"')}</button></div>`;

const tool=(l,run)=>`<div class="r${run?' run':''}">${ic(run?'clk':'check')}<span>${l}</span></div>`;
const tools=(sum,rows,open)=>`<details class="tools"${open?' open':''}><summary>${ic('arr')}${sum}</summary><div class="body">${rows}</div></details>`;
const ol=(t)=>`<a href="#" onclick="return false">${t}${X}</a>`;
const composer=(k)=>`<div class="cmp"><div class="pillc"><button class="rb add" aria-label="Attach">${ic('plus')}</button><span class="ph2">Message Devin agent</span><span class="tr"><button class="rb mic" aria-label="Voice">${ic('mic')}</button>${k==='run'?`<button class="rb stop" aria-label="Stop">${ic('sq')}</button>`:`<button class="rb snd" aria-label="Send" disabled>${ic('up')}</button>`}</span></div></div>`;
const dhead=(missing)=>`<div class="dh">${missing?'<span></span>':`<button class="who" title="Open full screen" aria-label="Open Devin agent full screen"><span class="bav">D</span><span class="n">Devin agent</span></button>`}<button class="cl28" aria-label="Collapse Devin agent" data-close>${ic('pclose')}</button></div>`;
function dock(kind){
 let body='';
 if(kind==='missing') return `<aside class="dock">${dhead(true)}<div class="miss"><button class="btn p">Create Devin agent</button></div></aside>`;
 if(kind==='intro') body=`<div class="intro"><p>Answers questions about what Devin is working on.</p><div class="sg"><button class="btn">Anything merged today?</button><button class="btn">What did Devin do this week?</button></div></div><div style="flex:1"></div>`;
 else if(kind==='run') body=`<div class="thr"><div class="sep">Oct 20, 9:41 AM</div><div class="u">Anything merged today?</div>${tools('Working… · 1 tool',tool('Session search',1),true)}</div>`;
 else if(kind==='cant') body=`<div class="thr"><div class="sep">Oct 20, 9:41 AM</div><div class="u">What is Add CSV export waiting on?</div>${tools('Done · 2 tools · 4s',tool('Session search')+tool('Session get messages'),false)}<div class="a"><p>I can't read that question. ${ol('Open Add CSV export in Devin')}</p></div></div>`;
 else body=`<div class="thr"><div class="sep">Oct 20, 9:41 AM</div>
  <div class="u">Anything merged today?</div>${tools('Done · 1 tool · 2s',tool('Session search'),false)}
  <div class="a"><p>One pull request: ${ol('acme/web#418')}, the flaky invoice export test fix.</p></div>
  <div class="u">What did Devin do on acme/api this week?</div>${tools('Done · 3 tools · 5s',tool('Session search')+tool('Session get messages ×2'),true)}
  <div class="a"><p>Two sessions touched acme/api:</p><ul>
   <li><b>Add pagination to the audit log API</b> opened ${ol('acme/api#215')} and is still working. ${ol('Open Add pagination in Devin')}</li>
   <li><b>Upgrade Prisma to 6.x</b> opened ${ol('acme/api#212')} and is waiting on a question about two conflicting migrations. ${ol('Open Upgrade Prisma in Devin')}</li></ul></div></div>`;
 return `<aside class="dock">${dhead()}${body}${composer(kind)}</aside>`;
}
function frame({w,h='900px',cur='dev',dot=true,body,open=false,dockKind='',id='',extra='',drawer=false}){
 const st=[w?`--w:${w}`:'',`--h:${h}`].filter(Boolean).join(';');
 return `<div class="wrapx"><div class="fw"${id?` id="${id}"`:''} style="${st}"><div class="shell${open?' open':''}${drawer?' drawer':''}">${sidebar(cur,dot)}<button class="drawscrim" aria-label="Close navigation" data-drawer-close></button><div class="col">${topbar}${body}</div>${dockKind?dock(dockKind):''}${extra}</div></div></div>`;
}
const cap=(t,s)=>`<div class="cap">${t}${s?`<span>${s}</span>`:''}</div>`;
const populated=page(header('acme')+tiles(3,2)+table(false));
const stale=`<main class="pg stale">${header('acme · Updated 4m ago')}${err('Devin rejected the key. Alerts are paused.','Reconnect')}${table(true)}</main>`;
const notConn=page(header('',false)+`<div class="center"><p>Connect Devin to see its sessions here.</p><button class="btn p">Connect Devin</button></div>`);
const member=page(header('',false)+`<div class="center"><p>Ask a space owner to connect Devin.</p></div>`);
const inbox=page(`<div class="ph"><h1>Inbox</h1></div>`+[['Quarterly invoice from Acme Hosting','Invoice attached for review'],['Re: onboarding checklist','Thanks, I will send the signed copy'],['Calendar: design review','Tomorrow, 10:00'],['Sample newsletter','Five things this week']].map(r=>`<div style="padding:12px 0;border-top:1px solid var(--border)"><div style="font-weight:500">${r[0]}</div><div class="dim" style="font-size:13px">${r[1]}</div></div>`).join(''));

const dlg=(state)=>`<div class="dlg" role="dialog" aria-label="Connect Devin"><button class="x" aria-label="Close">${ic('x')}</button>
 <div class="hd"><div class="tl"><span class="logo">D</span><h3>Connect Devin</h3></div><p class="ds">Connects Devin for everyone in this space. Read-only.</p></div>
 <form onsubmit="return false"><div class="f"><input type="password" autocomplete="off" aria-label="API key" placeholder="API key" ${state==='empty'?'':'value="cog_demo_key_0000"'}><a class="help" href="#" onclick="return false">Where to find your key${X}</a>${state==='refused'?'<p class="er" role="alert">The key was refused</p>':''}</div>
 <div class="ft"><button type="button" class="btn">Cancel</button><button type="submit" class="btn p"${state==='empty'||state==='connecting'?' disabled':''}>Connect</button></div></form></div>`;
const toast=(stack)=>`<div class="tview" role="status">${stack?`<div class="toast behind" aria-hidden="true" style="height:96px"></div>`:''}<div class="toast">${stack?'<span class="plus">+1</span>':''}<button class="bt"><span class="av" aria-hidden="true">D</span><span style="min-width:0;flex:1"><span class="tt"><b>Devin needs input</b><span>2m ago</span></span><span class="tb" style="display:block">Add CSV export for invoices: Should the export keep the legacy CSV column order?</span><span class="hint" style="display:block">Opens Devin</span></span></button><button class="cl" aria-label="Dismiss">${ic('x')}</button></div></div>`;

document.getElementById('root').innerHTML=
 cap('Devin page, panel open after Ask','Docked at 1280px and wider, overlays below with Escape or an outside click to close; the sidebar becomes a drawer under 1024px; rows become a list at narrow page widths. Use the Width switcher; every frame follows it except the drawer frame.')+
 frame({id:'main',body:populated,open:true,dockKind:'main'})+
 cap('First visit, panel closed')+frame({h:'600px',body:populated})+
 cap('Panel: first Ask')+frame({h:'600px',body:populated,open:true,dockKind:'intro'})+
 cap('Panel: running turn')+frame({h:'600px',body:populated,open:true,dockKind:'run'})+
 cap('Panel: the agent cannot read the question')+frame({h:'600px',body:populated,open:true,dockKind:'cant'})+
 cap('Panel: agent missing')+frame({h:'420px',body:populated,open:true,dockKind:'missing'})+
 cap('Navigation drawer (below 1024px)','Fixed at 390px.')+frame({w:'390px',h:'600px',body:populated,drawer:true})+
 cap('Loading')+frame({h:'620px',dot:false,body:page(skel())})+
 cap('Empty')+frame({h:'360px',dot:false,body:page(header('acme')+`<div class="center"><p>No Devin sessions yet.</p><a class="lk" href="#" onclick="return false">Open Devin${X}</a></div>`)})+
 cap('Load error')+frame({h:'300px',dot:false,body:page(header('acme',false)+err('Could not load Devin sessions.','Try again'))})+
 cap('Key rejected, stale data','Notice takes the place of the tiles; rows are muted; alerts are paused so the sidebar dot is hidden.')+frame({h:'760px',dot:false,body:stale})+
 cap('Not connected, a member who may connect')+frame({h:'360px',dot:false,body:notConn})+
 cap('Not connected, a member who may not connect')+frame({h:'360px',dot:false,body:member})+
 cap('Connect dialog over the page','Connect closes the dialog and opens /app/devin.')+frame({h:'560px',dot:false,body:notConn,extra:`<div class="dscrim">${dlg('empty')}</div>`})+
 cap('Connect dialog: connecting and refused')+`<div class="dlgrow">${dlg('connecting')}${dlg('refused')}</div>`+
 cap('Needs-input notification toast, over another page','Clicking opens that session in Devin (external) and marks the notification seen.')+frame({h:'600px',cur:'inbox',body:inbox,extra:toast(false)})+
 cap('Two notifications stacked')+frame({h:'600px',cur:'inbox',body:inbox,extra:toast(true)});

/* controls */
const root=document.documentElement,th=document.getElementById('th'),wd=document.getElementById('wd');
function seg(el,vals,on){vals.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v;b.setAttribute('aria-pressed',i===0);b.onclick=()=>{el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));on(v)};el.append(b)})}
seg(th,['auto','light','dark'],v=>v==='auto'?root.removeAttribute('data-theme'):root.dataset.theme=v);
const mf=document.getElementById('main').firstElementChild;
seg(wd,['1440','1100','900','390'],v=>{root.style.setProperty('--fw',v+'px');mf.classList.toggle('open',+v>=1280)});
const wide=s=>s.parentElement.getBoundingClientRect().width>=1280;
document.addEventListener('click',e=>{
 const s=e.target.closest('.shell');
 if(s){
  if(e.target.closest('[data-ask]'))s.classList.add('open');
  if(e.target.closest('[data-close]'))s.classList.remove('open');
  if(e.target.closest('[data-drawer-open]'))s.classList.add('drawer');
  if(e.target.closest('[data-drawer-close]'))s.classList.remove('drawer');
 }
 document.querySelectorAll('.shell.open').forEach(o=>{if(!wide(o)&&o.contains(e.target)&&!e.target.closest('.dock')&&!e.target.closest('[data-ask]'))o.classList.remove('open')});
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.shell').forEach(o=>{if(!wide(o))o.classList.remove('open');o.classList.remove('drawer')})});
</script>
</body>
</html>
