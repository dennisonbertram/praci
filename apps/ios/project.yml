name: Praci
options:
  bundleIdPrefix: com.rakazo
  deploymentTarget:
    iOS: "26.0"
  groupSortPosition: top
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
packages:
  RakazoAPI:
    path: Packages/RakazoAPI
  RakazoCore:
    path: Packages/RakazoCore
  RakazoUI:
    path: Packages/RakazoUI
targets:
  Praci:
    type: application
    platform: iOS
    sources:
      - Sources/Praci
    dependencies:
      - package: RakazoAPI
      - package: RakazoCore
      - package: RakazoUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.praci.mobile
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Praci
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ai.praci.mobile.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: ai.praci.mobile
          # The recorded-meeting fixture is for Debug builds and the Maestro flow only.
          EXCLUDED_SOURCE_FILE_NAMES: FileAudioSource.swift meeting-fixture.m4a
    info:
      path: Praci-Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - rakazo
        NSLocalNetworkUsageDescription: Connect to your Praci server on your local network.
        NSCameraUsageDescription: Scan the QR code from your Praci server.
        NSMicrophoneUsageDescription: Talk to your agent and record meetings.
        UIBackgroundModes:
          - audio
        NSSpeechRecognitionUsageDescription: Turn your speech into messages.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  PraciTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/PraciTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: ai.praci.mobile.tests
    dependencies:
      - target: Praci
      - package: RakazoCore
      - package: RakazoAPI
schemes:
  Praci:
    build:
      targets:
        Praci: all
    test:
      config: Debug
      targets:
        - PraciTests
        - package: RakazoAPI/RakazoAPITests
        - package: RakazoCore/RakazoCoreTests
        - package: RakazoUI/RakazoUITests
