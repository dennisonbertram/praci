name: Praci
options:
  bundleIdPrefix: com.rakazo
  deploymentTarget:
    iOS: "26.0"
  groupSortPosition: top
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
packages:
  RakazoAPI:
    path: Packages/RakazoAPI
  RakazoCore:
    path: Packages/RakazoCore
  RakazoUI:
    path: Packages/RakazoUI
targets:
  Praci:
    type: application
    platform: iOS
    sources:
      - Sources/Praci
    dependencies:
      - package: RakazoAPI
      - package: RakazoCore
      - package: RakazoUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rakazo.app
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Praci
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.rakazo.app.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.rakazo.app
    info:
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - rakazo
  PraciTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/PraciTests
    dependencies:
      - target: Praci
schemes:
  Praci:
    build:
      targets:
        Praci: all
    test:
      config: Debug
      targets:
        - PraciTests
        - package: RakazoAPI/RakazoAPITests
        - package: RakazoCore/RakazoCoreTests
        - package: RakazoUI/RakazoUITests
